include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
modulepath /usr/lib/openldap
moduleload back_mdb.so
pidfile /run/openldap/slapd.pid
TLSCACertificateFile /certs/ca.pem
TLSCertificateFile /certs/server.pem
TLSCertificateKeyFile /certs/server.key
database mdb
suffix "dc=acme,dc=test"
rootdn "cn=admin,dc=acme,dc=test"
rootpw admin-secret
directory /var/lib/openldap/data
access to attrs=userPassword by self read by anonymous auth by * none
access to * by users read by * none
