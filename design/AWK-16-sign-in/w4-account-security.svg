  <text x="1042" y="881" font-size="13.5" font-weight="400" fill="#111" text-anchor="start">••••••••</text>
  <rect x="1030" y="930" width="130" height="36" rx="6" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="1095.0" y="953.0" font-size="13" font-weight="500" fill="#111" text-anchor="middle">Use a passkey</text>
  <rect x="1300" y="930" width="110" height="36" rx="6" fill="#222" stroke="#222" stroke-width="1.2"/>
  <text x="1355.0" y="953.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Remove</text>
  <circle cx="1020" cy="786" r="10" fill="#444"/>
  <text x="1020" y="790" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <text x="980" y="1050" font-size="13" font-weight="600" fill="#444" text-anchor="start">E · Sign-in with a passkey · DE (W1 A, button now active)</text>
  <rect x="980" y="1060" width="480" height="300" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="1010" y="1090" width="420" height="240" rx="8" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1030" y="1126" font-size="20" font-weight="700" fill="#111" text-anchor="start">Anmelden</text>
  <rect x="1030" y="1146" width="380" height="30" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1042" y="1166" font-size="12.5" font-weight="400" fill="#999" text-anchor="start">name@firma.at</text>
  <rect x="1030" y="1186" width="380" height="30" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <rect x="1030" y="1228" width="380" height="32" rx="6" fill="#222" stroke="#222" stroke-width="1.2"/>
  <text x="1220.0" y="1249.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Anmelden</text>
  <rect x="1030" y="1272" width="380" height="32" rx="6" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="1220.0" y="1293.0" font-size="13" font-weight="500" fill="#111" text-anchor="middle">Mit Passkey anmelden</text>
  <circle cx="1020" cy="1286" r="10" fill="#444"/>
  <text x="1020" y="1290" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text>
  <text x="980" y="1390" font-size="13" font-weight="600" fill="#444" text-anchor="start">F · Phone · EN (sections stack)</text>
  <rect x="980" y="1400" width="300" height="280" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="996" y="1420" width="268" height="44" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1010" y="1447" font-size="14" font-weight="700" fill="#111" text-anchor="start">Passkeys</text>
  <rect x="996" y="1474" width="268" height="44" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1010" y="1501" font-size="14" font-weight="700" fill="#111" text-anchor="start">Two-factor  ✓ On</text>
  <rect x="996" y="1528" width="268" height="44" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1010" y="1555" font-size="14" font-weight="700" fill="#111" text-anchor="start">Password</text>
  <rect x="996" y="1582" width="268" height="44" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1010" y="1609" font-size="14" font-weight="700" fill="#111" text-anchor="start">Preferences</text>
  <text x="40" y="1720" font-size="12" font-weight="400" fill="#333" text-anchor="start">1  Passkeys (WebAuthn, ASP.NET Core Identity in .NET 10). A passkey with user verification counts as two-factor: owners and admins may use it instead of the app code.</text>
  <text x="40" y="1740" font-size="12" font-weight="400" fill="#333" text-anchor="start">2  Two-factor: shows status and recovery codes left. New codes replace the old ones. &#x27;Turn off&#x27; is shown disabled (greyed out) for owners and admins, with the reason next to it.</text>
  <text x="40" y="1760" font-size="12" font-weight="400" fill="#333" text-anchor="start">3  Password change needs the current password and signs out other sessions. 4  Language and theme per user, stored with the account, not only in the browser.</text>
  <text x="40" y="1780" font-size="12" font-weight="400" fill="#333" text-anchor="start">5  Sign out everywhere ends all other sessions (security stamp).  6  Adding: browser prompt first, then an optional name.  7  Removing a passkey, new recovery codes,</text>
  <text x="40" y="1800" font-size="12" font-weight="400" fill="#333" text-anchor="start">    moving to a new phone and turning two-factor off ask for the password or another passkey first.  8  The sign-in button from W1 becomes active; it hides where the browser has no passkey support.</text>
  <text x="40" y="1820" font-size="12" font-weight="400" fill="#333" text-anchor="start">All changes are audited on the instance chain. Account menu (M3): &#x27;Account and security&#x27; opens this page; the menu lines &#x27;Two-factor: on&#x27;, &#x27;Passkeys&#x27;, &#x27;Language&#x27;, &#x27;Theme&#x27; link to its sections.</text>
</svg>
