  <text x="1355.0" y="313.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Speichern</text>
  <circle cx="1020" cy="146" r="10" fill="#444"/>
  <text x="1020" y="150" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="980" y="410" font-size="13" font-weight="600" fill="#444" text-anchor="start">C · Passkey not possible / cancelled · EN</text>
  <rect x="980" y="420" width="480" height="260" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="1010" y="450" width="420" height="70" rx="6" fill="#eee" stroke="#111" stroke-width="2"/>
  <text x="1026" y="476" font-size="13" font-weight="600" fill="#111" text-anchor="start">This browser does not support passkeys.</text>
  <text x="1026" y="498" font-size="12.5" font-weight="400" fill="#444" text-anchor="start">Use a current Chrome, Edge, Safari or Firefox.</text>
  <rect x="1010" y="536" width="420" height="70" rx="6" fill="#eee" stroke="#999" stroke-width="1.2"/>
  <text x="1026" y="562" font-size="13" font-weight="600" fill="#111" text-anchor="start">The passkey was not added.</text>
  <text x="1026" y="584" font-size="12.5" font-weight="400" fill="#444" text-anchor="start">You cancelled, or the device did not answer. Try again.</text>
  <text x="1010" y="640" font-size="12" font-weight="400" fill="#555" text-anchor="start" font-style="italic">Nothing changes; the list stays as it was.</text>
