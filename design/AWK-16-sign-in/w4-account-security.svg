  <rect x="980" y="720" width="480" height="300" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="1010" y="750" width="420" height="240" rx="8" fill="#fff" stroke="#333" stroke-width="1.2"/>
