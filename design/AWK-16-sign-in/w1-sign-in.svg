  <text x="40" y="1400" font-size="12" font-weight="400" fill="#333" text-anchor="start">1  One form for everyone: email + password. The organisation is chosen after sign-in (one account per person, W3).</text>
  <text x="40" y="1418" font-size="12" font-weight="400" fill="#333" text-anchor="start">2  Passkey is offered from the start (ASP.NET Core Identity). External buttons appear only for tenants that opted in (AWK-12).</text>
  <text x="40" y="1436" font-size="12" font-weight="400" fill="#333" text-anchor="start">3  Errors never reveal whether an email exists. Remaining tries are shown before the pause.  4  TOTP two-factor; recovery codes.</text>
  <text x="40" y="1454" font-size="12" font-weight="400" fill="#333" text-anchor="start">5  Lockout: 15 min after 5 failures; the owner is emailed; audited (observability.md).  6  Reset link: single use, 30 min.</text>
