  <rect x="1096" y="332" width="348" height="30" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1106" y="351" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">Customer satisfaction 2026</text>
  <text x="1096" y="386" font-size="10.5" font-weight="600" fill="#666" text-anchor="start">WELCOME TEXT (EN)</text>
  <rect x="1096" y="394" width="348" height="54" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1106" y="413" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">Thank you for taking part. Your opinion…</text>
  <text x="1096" y="472" font-size="10.5" font-weight="600" fill="#666" text-anchor="start">THANK-YOU TEXT (EN)</text>
  <rect x="1096" y="480" width="348" height="30" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="1106" y="499" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">Thank you! Your answers are saved.</text>
  <text x="1096" y="540" font-size="10.5" font-weight="600" fill="#666" text-anchor="start">LANGUAGES</text>
  <text x="1096" y="562" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">German (default) · English   — Manage…</text>
  <text x="1096" y="600" font-size="11" font-weight="400" fill="#666" text-anchor="start">Texts missing in a language show up in</text>
  <text x="1096" y="616" font-size="11" font-weight="400" fill="#666" text-anchor="start">Translations and in the publish checks,</text>
  <text x="1096" y="632" font-size="11" font-weight="400" fill="#666" text-anchor="start">like question texts.</text>
