  <rect x="860" y="816" width="170" height="82" rx="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="874" y="840" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">In a side panel  ✓</text>
  <text x="874" y="864" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">In a new tab  ↗</text>
  <text x="874" y="886" font-size="11" font-weight="400" fill="#888" text-anchor="start">Ctrl Shift P</text>
  <rect x="40" y="818" width="470" height="512" rx="0" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2"/>
  <text x="60" y="850" font-size="12" font-weight="400" fill="#555" text-anchor="start">Canvas and outline stay usable;</text>
  <text x="60" y="868" font-size="12" font-weight="400" fill="#555" text-anchor="start">the preview follows edits after saving.</text>
  <rect x="520" y="908" width="510" height="412" rx="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <rect x="520" y="908" width="510" height="40" rx="0" fill="#eee" stroke="#ccc" stroke-width="1.2"/>
  <text x="534" y="933" font-size="11" font-weight="700" fill="#7a3b00" text-anchor="start">PREVIEW · answers are not saved</text>
  <rect x="768" y="916" width="120" height="24" rx="12" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="800" y="933" font-size="11.5" font-weight="600" fill="#111" text-anchor="start">Phone</text>
  <rect x="830" y="916" width="58" height="24" rx="12" fill="#555" stroke="none" stroke-width="1.2"/>
  <text x="859" y="933" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Desktop</text>
  <rect x="898" y="914" width="66" height="28" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="931.0" y="933.0" font-size="11.5" font-weight="600" fill="#111" text-anchor="middle">Restart</text>
  <text x="1018" y="933" font-size="16" font-weight="600" fill="#111" text-anchor="end">×</text>
  <text x="550" y="980" font-size="11" font-weight="600" fill="#555" text-anchor="start">Page 2 of 3 · Your visit</text>
  <rect x="550" y="988" width="450" height="5" rx="0" fill="#555" stroke="none" stroke-width="1.2"/>
  <text x="550" y="1026" font-size="15" font-weight="700" fill="#111" text-anchor="start">How satisfied are you with our service? *</text>
  <rect x="550" y="1040" width="82" height="40" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="591" y="1065" font-size="14" font-weight="600" fill="#111" text-anchor="middle">1</text>
  <rect x="640" y="1040" width="82" height="40" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="681" y="1065" font-size="14" font-weight="600" fill="#111" text-anchor="middle">2</text>
  <rect x="730" y="1040" width="82" height="40" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="771" y="1065" font-size="14" font-weight="600" fill="#111" text-anchor="middle">3</text>
  <rect x="820" y="1040" width="82" height="40" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="861" y="1065" font-size="14" font-weight="600" fill="#111" text-anchor="middle">4</text>
  <rect x="910" y="1040" width="82" height="40" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="951" y="1065" font-size="14" font-weight="600" fill="#111" text-anchor="middle">5</text>
  <text x="550" y="1110" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">Same runner, same checks per page as the real survey:</text>
  <text x="550" y="1126" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">missing answers, formats, limits. Nothing is stored,</text>
  <text x="550" y="1142" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">no response is counted.</text>
  <rect x="910" y="1260" width="90" height="36" rx="4" fill="#555" stroke="#555" stroke-width="1.2"/>
  <text x="955.0" y="1283.0" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Next</text>
  <circle cx="1020" cy="790" r="10" fill="#444"/>
  <text x="1020" y="794" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="1080" y="760" font-size="13" font-weight="600" fill="#444" text-anchor="start">C · In a new tab · phone width · DE</text>
  <rect x="1080" y="770" width="380" height="560" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="1120" y="790" width="300" height="520" rx="18" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <rect x="1120" y="790" width="300" height="34" rx="0" fill="#7a3b00" stroke="none" stroke-width="1.2"/>
  <text x="1270" y="812" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">VORSCHAU · Antworten werden nicht gespeichert</text>
  <text x="1140" y="860" font-size="18" font-weight="700" fill="#111" text-anchor="start">Kundenzufriedenheit 2026</text>
  <text x="1140" y="888" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Danke, dass Sie mitmachen.</text>
  <text x="1140" y="916" font-size="12" font-weight="600" fill="#555" text-anchor="start">Etwa 3 Minuten · 9 Fragen</text>
  <rect x="1140" y="936" width="260" height="44" rx="4" fill="#555" stroke="#555" stroke-width="1.2"/>
  <text x="1270.0" y="963.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Umfrage starten</text>
  <text x="1140" y="1020" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">Address: /s/{survey}?preview (only for</text>
  <text x="1140" y="1036" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">signed-in editors of the organisation;</text>
  <text x="1140" y="1052" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">others see “Survey not found”).</text>
  <text x="1140" y="1090" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">The banner stays on every screen,</text>
  <text x="1140" y="1106" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">incl. the thank-you page.</text>
  <circle cx="1440" cy="790" r="10" fill="#444"/>
  <text x="1440" y="794" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="40" y="1380" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">1 “Survey settings” is the first outline entry; selecting it shows the settings in the inspector and the welcome and thank-you pages on the canvas (Ctrl K → “Survey settings” too).</text>
  <text x="40" y="1404" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">2 Welcome title and text, and the thank-you text, are edited on the canvas like question texts, per language; missing translations count like any text (W4 / M2 rules).</text>
  <text x="40" y="1428" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">3 Layout: classic (default) or one at a time; welcome page on/off. All of it is part of the draft and takes effect when published (versioned with the survey).</text>
  <text x="40" y="1452" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">4 Preview in a side panel: the draft (saved state) in the real runner, phone or desktop width, Restart; the designer stays usable. 5 In a new tab: same, full window; for sharing with colleagues of the organisation.</text>
  <text x="40" y="1476" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Preview checks each page on the server like the real survey, but stores nothing and never counts as a response.</text>
</svg>
