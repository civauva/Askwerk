  <text x="62" y="171" font-size="13" font-weight="600" fill="#fff" text-anchor="start">⚙  Survey settings</text>
  <text x="56" y="210" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">1 · Welcome</text>
  <text x="56" y="234" font-size="12" font-weight="400" fill="#333" text-anchor="start">Welcome text  INTRO</text>
  <text x="56" y="258" font-size="12" font-weight="600" fill="#333" text-anchor="start">2 · Your visit</text>
  <text x="56" y="282" font-size="12" font-weight="400" fill="#333" text-anchor="start">  How satisfied…  SAT_1</text>
  <text x="56" y="306" font-size="12" font-weight="400" fill="#333" text-anchor="start">  What could we improve?  IMPROVE</text>
  <text x="56" y="330" font-size="12" font-weight="600" fill="#333" text-anchor="start">3 · About you</text>
  <text x="56" y="354" font-size="12" font-weight="400" fill="#333" text-anchor="start">  Age group  AGE</text>
  <text x="56" y="378" font-size="12" font-weight="400" fill="#333" text-anchor="start">+ Add page</text>
  <text x="56" y="402" font-size="12" font-weight="400" fill="#333" text-anchor="start">Ending: thank-you page</text>
