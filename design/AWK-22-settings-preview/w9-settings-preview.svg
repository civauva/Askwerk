  <text x="24" y="60" font-size="12.5" font-weight="400" fill="#444" text-anchor="start">Follows the designer (M1, W4): outline · canvas · inspector. Settings are part of the draft, versioned with the survey; texts per survey language.</text>
  <text x="40" y="80" font-size="13" font-weight="600" fill="#444" text-anchor="start">A · Survey settings · EN (outline entry “Survey settings” at the top, or Ctrl K → “Survey settings”)</text>
