  <rect x="310" y="138" width="760" height="592" rx="0" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2"/>
  <text x="340" y="170" font-size="10.5" font-weight="700" fill="#7a3b00" text-anchor="start">CANVAS · the welcome page as respondents see it (edited inline)</text>
  <rect x="370" y="184" width="640" height="300" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="400" y="230" font-size="26" font-weight="700" fill="#111" text-anchor="start">Customer satisfaction 2026</text>
  <text x="400" y="262" font-size="14" font-weight="400" fill="#333" text-anchor="start">Thank you for taking part. Your opinion helps us get better.</text>
  <text x="400" y="296" font-size="12.5" font-weight="600" fill="#555" text-anchor="start">About 3 minutes · 9 questions</text>
  <rect x="400" y="320" width="190" height="40" rx="4" fill="#555" stroke="#555" stroke-width="1.2"/>
  <text x="495.0" y="345.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Start the survey</text>
  <text x="400" y="400" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">Title and text are edited here like question texts; the length is</text>
  <text x="400" y="416" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">counted from the questions. Language switch DE | EN as everywhere.</text>
  <rect x="370" y="504" width="640" height="140" rx="6" fill="#fff" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="390" y="530" font-size="10.5" font-weight="700" fill="#666" text-anchor="start">THANK-YOU PAGE</text>
  <text x="390" y="562" font-size="18" font-weight="700" fill="#111" text-anchor="start">Thank you! Your answers are saved.</text>
  <text x="390" y="588" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">Shown after Send; empty means the standard text in the respondent's</text>
  <text x="390" y="604" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">language.</text>
  <circle cx="360" cy="200" r="10" fill="#444"/>
