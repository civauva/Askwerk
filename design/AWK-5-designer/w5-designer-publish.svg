<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <!-- W5 AWK-5 designer publish flow (supersedes W3), grayscale wireframe -->
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#fafafa" stroke="none" stroke-width="1.2"/>
  <text x="24" y="36" font-size="20" font-weight="600" fill="#111" text-anchor="start">W5 · AWK-5 Designer — publish flow (EN/DE), supersedes W3 · 2026-10-13</text>
  <text x="24" y="58" font-size="12" font-weight="400" fill="#555" text-anchor="start">One screen per step: check, then the published survey with links, QR code, embed and PDF. Source design/AWK-5-designer/w5-designer-publish.svg</text>
  <text x="24" y="90" font-size="14" font-weight="600" fill="#111" text-anchor="start">A · Publish check (EN)</text>
  <rect x="24" y="100" width="500" height="760" rx="10" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="48" y="140" font-size="18" font-weight="600" fill="#111" text-anchor="start">Publish “Customer satisfaction 2026”</text>
  <rect x="48" y="169" width="20" height="20" rx="10" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="58" y="184" font-size="12" font-weight="700" fill="#111" text-anchor="middle">✓</text>
  <text x="78" y="184" font-size="13" font-weight="400" fill="#111" text-anchor="start">12 questions on 3 pages are complete.</text>
  <rect x="48" y="203" width="20" height="20" rx="10" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="58" y="218" font-size="12" font-weight="700" fill="#111" text-anchor="middle">✓</text>
  <text x="78" y="218" font-size="13" font-weight="400" fill="#111" text-anchor="start">Logic has no loops and every jump has a target.</text>
  <rect x="48" y="237" width="20" height="20" rx="10" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="58" y="252" font-size="12" font-weight="700" fill="#111" text-anchor="middle">✓</text>
  <text x="78" y="252" font-size="13" font-weight="400" fill="#111" text-anchor="start">Variable names are unique; 1 rename is mapped (SATISFACTION → SAT_1).</text>
  <rect x="48" y="280" width="452" height="150" rx="8" fill="#ececec" stroke="#111" stroke-width="3"/>
  <rect x="64" y="296" width="30" height="30" rx="15" fill="#111" stroke="none" stroke-width="1.2"/>
  <text x="79" y="318" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">!</text>
  <text x="108" y="310" font-size="16" font-weight="700" fill="#111" text-anchor="start">3 texts are missing in German</text>
  <text x="108" y="332" font-size="13" font-weight="400" fill="#222" text-anchor="start">Respondents who choose German will see these</text>
  <text x="108" y="350" font-size="13" font-weight="400" fill="#222" text-anchor="start">texts in English:</text>
  <text x="108" y="374" font-size="12.5" font-weight="400" fill="#222" text-anchor="start">• What could we improve?  • Age group  • Thank-you page</text>
  <rect x="108" y="388" width="130" height="30" rx="6" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="173.0" y="408" font-size="13" font-weight="500" fill="#111" text-anchor="middle">Fix translations</text>
  <text x="250" y="408" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">3 of 3 shown</text>
  <line x1="48" y1="456" x2="500" y2="456" stroke="#ddd" stroke-width="1"/>
  <text x="48" y="486" font-size="13" font-weight="400" fill="#333" text-anchor="start">This creates version 3. Answers already collected stay with version 2.</text>
  <text x="48" y="506" font-size="13" font-weight="400" fill="#333" text-anchor="start">Version 3 cannot be edited later; changes go into a new draft.</text>
  <text x="48" y="546" font-size="12" font-weight="600" fill="#444" text-anchor="start">Survey address</text>
