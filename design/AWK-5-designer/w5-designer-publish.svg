  <rect x="1216" y="276" width="100" height="30" rx="6" fill="#222" stroke="#222" stroke-width="1.2"/>
  <text x="1266.0" y="296" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Try again</text>
  <rect x="1328" y="276" width="120" height="30" rx="6" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="1388.0" y="296" font-size="13" font-weight="500" fill="#111" text-anchor="middle">Copy reference</text>
  <text x="1216" y="340" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">DE: “Veröffentlichen fehlgeschlagen”</text>
  <text x="1216" y="358" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">“Es hat sich nichts geändert: Version 2</text>
  <text x="1216" y="376" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">bleibt online.” · “Erneut versuchen”</text>
  <text x="1192" y="440" font-size="14" font-weight="600" fill="#111" text-anchor="start">Notes</text>
  <text x="1192" y="466" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Missing translations: a large warning lists them</text>
  <text x="1192" y="486" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">and the button says so; publishing stays possible.</text>
  <text x="1192" y="506" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Errors that make the survey unusable (a jump</text>
  <text x="1192" y="526" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">without target) block, with a link to the place.</text>
  <text x="1192" y="546" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">Publish is audited (survey.published, version 3).</text>
  <text x="1192" y="566" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">The domain list shows verified domains only;</text>
  <text x="1192" y="586" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">the primary one is preselected.</text>
