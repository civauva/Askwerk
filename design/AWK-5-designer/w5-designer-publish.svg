  <text x="760" y="408" font-size="11.5" font-weight="400" fill="#222" text-anchor="start" font-family="Consolas, monospace">  data-survey=&quot;kz26&quot; data-lang=&quot;de&quot;&gt;&lt;/script&gt;</text>
