<!-- M1 · AWK-5 hi-fi mockups of the designer in the Werkstatt brand, from the approved wireframes W2, W4, W5. -->
<title>Askwerk Designer Hi-Fi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: each screen is a fixed 1440 x 900 frame, stacked; the page scrolls sideways on small screens. */
:root { --page: #e9e7e2; --page-ink: #1a1917; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0d0c0b; --page-ink: #f2efea; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #0d0c0b; --page-ink: #f2efea; color-scheme: dark; }
body { background: var(--page); color: var(--page-ink); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; padding-inline: 16px; padding-block: 24px 64px; }
main { display: grid; gap: 40px; justify-items: start; }
.label { font: 600 13px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; }
.wrap { overflow-x: auto; max-width: 100%; }

.t-light { --paper:#f6f5f2; --surface:#ffffff; --ink:#1a1917; --graphite:#4a4640; --muted:#6e6962; --line:#e3dfd8; --line-strong:#c8c2b8;
  --signal:#d2440f; --signal-soft:#fbe6da; --signal-ink:#8f2c06; --on-signal:#ffffff; --steel:#3e4a56; --ok:#2e7d4f; --warn:#a86a12; --warn-soft:#fbf1de; --error:#b42318; --grid:rgba(26,25,23,.05); --shadow:0 8px 24px rgba(26,25,23,.12); color-scheme: light; }
.t-dark { --paper:#141311; --surface:#1c1a18; --ink:#f2efea; --graphite:#c9c3ba; --muted:#9c958b; --line:#2f2b27; --line-strong:#48423b;
  --signal:#ff7a3d; --signal-soft:#3a2014; --signal-ink:#ffb48f; --on-signal:#1a0a03; --steel:#9fb0c0; --ok:#6cc28f; --warn:#e3a948; --warn-soft:#2f2516; --error:#f2877b; --grid:rgba(242,239,234,.05); --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme: dark; }

.screen { width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.5 "IBM Plex Sans", sans-serif; border: 1px solid var(--line-strong); }
.screen * { box-sizing: border-box; }
.mono { font-family: "IBM Plex Mono", monospace; }
.disp { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; }

/* Top bar */
.bar { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brandline { display: flex; align-items: baseline; gap: 12px; }
.logo { display: inline-flex; align-items: baseline; gap: 8px; }
.logo svg { align-self: center; }
.logo .word { font: 700 19px/1 "IBM Plex Sans Condensed", sans-serif; letter-spacing: -.01em; }
.logo .word b { color: var(--signal); font-weight: 700; }
.sep { width: 1px; height: 20px; background: var(--line-strong); align-self: center; }
.crumb { font: 600 15px/1 "IBM Plex Sans", sans-serif; }
.stat { font: 500 11.5px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat.bad { color: var(--error); }
.grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 2px; font: 600 12px/1 "IBM Plex Mono", monospace; }
.seg span { padding: 7px 14px; }
.seg .on { background: var(--ink); color: var(--paper); }
.kbd { font: 500 11.5px/1 "IBM Plex Mono", monospace; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 2px; padding: 5px 7px; }
.btn { font: 600 13.5px/1 "IBM Plex Sans", sans-serif; padding: 10px 14px; border-radius: 2px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--on-signal); }
.btn.quiet { border-color: var(--line-strong); }

/* Regions */
.work { display: grid; grid-template-columns: 280px 1fr 340px; height: calc(900px - 56px); }
.outline { background: var(--surface); border-right: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.search { border: 1px solid var(--line-strong); border-radius: 2px; padding: 8px 10px; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
.pg { font: 600 11px/1 "IBM Plex Mono", monospace; letter-spacing: .07em; color: var(--muted); margin: 12px 6px 6px; display: flex; justify-content: space-between; }
.q { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center; padding: 7px 8px; border-radius: 2px; font-size: 13.5px; }
.q .grip { color: var(--line-strong); font-size: 11px; letter-spacing: -2px; }
.q code { font: 400 11px/1 "IBM Plex Mono", monospace; color: var(--muted); }
.q.sel { background: var(--signal-soft); color: var(--signal-ink); box-shadow: inset 2px 0 0 var(--signal); }
.q.sel code { color: var(--signal-ink); }
.q .miss { width: 6px; height: 6px; background: var(--warn); display: inline-block; margin-left: 6px; }
.addpage { font-weight: 600; font-size: 13px; padding: 10px 8px; color: var(--graphite); }
.outfoot { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 8px 0; font: 400 12px/1.8 "IBM Plex Mono", monospace; color: var(--muted); }
.canvas { background-color: var(--paper); overflow: hidden; padding: 30px 0; position: relative; }
/* The 24 px grid is optional: off by default, switched on per user with the Grid toggle (remembered in the user's preferences). */
.canvas.grid { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.gridtoggle { position: absolute; right: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 8px; font: 500 11.5px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 2px; padding: 6px 8px; }
.gridtoggle i { width: 12px; height: 12px; border: 1px solid var(--line-strong); background-image: linear-gradient(var(--line-strong) 1px, transparent 1px), linear-gradient(90deg, var(--line-strong) 1px, transparent 1px); background-size: 4px 4px; }
.gridtoggle.on { color: var(--ink); border-color: var(--ink); }
.page { width: 640px; margin: 0 auto; display: grid; gap: 18px; }
.ruler { position: relative; height: 14px; border-bottom: 2px solid var(--ink); background-image: repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 32px); background-size: 100% 7px; background-repeat: no-repeat; background-position: bottom; }
.ruler i { position: absolute; left: 0; bottom: -2px; height: 6px; background: var(--signal); }
.prog { display: flex; justify-content: space-between; font: 500 12px/1 "IBM Plex Mono", monospace; color: var(--muted); margin-bottom: 6px; }
.card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px; padding: 20px 22px; position: relative; }
.card.sel { border: 2px solid var(--signal); box-shadow: var(--shadow); }
.card .qno { font: 600 11.5px/1 "IBM Plex Mono", monospace; letter-spacing: .07em; color: var(--signal-ink); margin-bottom: 10px; display: flex; justify-content: space-between; }
.card h3 { font: 600 22px/1.2 "IBM Plex Sans Condensed", sans-serif; margin: 0 0 6px; letter-spacing: -.005em; }
.card h3 .req { color: var(--signal); }
.card p { margin: 0 0 16px; color: var(--muted); }
.caret { display: inline-block; width: 2px; height: 22px; background: var(--signal); vertical-align: -4px; margin-left: 1px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line-strong); border-radius: 2px; overflow: hidden; }
.scale span { text-align: center; padding: 13px 0; font: 500 16px/1 "IBM Plex Mono", monospace; border-left: 1px solid var(--line); background: var(--surface); }
.scale span:first-child { border-left: none; }
.ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.cardfoot { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line-strong); font: 400 11.5px/1 "IBM Plex Mono", monospace; color: var(--muted); }
.cardfoot span:last-child { color: var(--graphite); }
.insert { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 500 11.5px/1 "IBM Plex Mono", monospace; }
.insert::before, .insert::after { content: ""; flex: 1; border-top: 1px dashed var(--signal); }
.insert b { width: 26px; height: 26px; border: 1px solid var(--signal); color: var(--signal); display: grid; place-items: center; font: 600 16px/1 "IBM Plex Sans", sans-serif; border-radius: 2px; background: var(--surface); }
.area { border: 1px solid var(--line-strong); border-radius: 2px; height: 72px; padding: 10px 12px; color: var(--muted); }
.typemenu { position: absolute; left: calc(50% - 320px); top: 560px; width: 360px; background: var(--surface); border: 1px solid var(--ink); border-radius: 4px; box-shadow: var(--shadow); padding: 10px; }
.typemenu .filter { border: 1px solid var(--signal); border-radius: 2px; padding: 7px 10px; margin-bottom: 8px; font-size: 13.5px; }
.typemenu .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.typemenu .grid span { padding: 7px 8px; border-radius: 2px; font-size: 13.5px; display: flex; justify-content: space-between; }
.typemenu .grid span code { font: 400 11px/1 "IBM Plex Mono", monospace; color: var(--muted); }
.typemenu .grid span.hl { background: var(--signal-soft); color: var(--signal-ink); }
.typemenu .hint { font: 400 11.5px/1 "IBM Plex Mono", monospace; color: var(--muted); padding: 8px 8px 2px; }
.inspector { background: var(--surface); border-left: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.tabs span { padding-bottom: 10px; color: var(--muted); font-weight: 500; }
.tabs .on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--signal); }
.lab { font: 500 11px/1 "IBM Plex Mono", monospace; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
.field { border: 1px solid var(--line-strong); border-radius: 2px; padding: 9px 11px; background: var(--surface); display: flex; justify-content: space-between; }
.note { font-size: 12px; color: var(--muted); margin-top: 5px; }
.toggle { display: flex; align-items: center; gap: 10px; }
.toggle b { width: 34px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; flex: none; }
.toggle b::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); }
.toggle b.on { background: var(--signal); }
.toggle b.on::after { left: 18px; }
.cond { border: 1px dashed var(--line-strong); border-radius: 2px; padding: 10px 12px; color: var(--graphite); }
.cond b { color: var(--signal-ink); }
.menu { position: absolute; background: var(--surface); border: 1px solid var(--ink); border-radius: 4px; box-shadow: var(--shadow); padding: 6px; z-index: 2; }
.menu div { padding: 8px 10px; border-radius: 2px; display: flex; justify-content: space-between; gap: 24px; font-size: 13.5px; }
.menu div.on { background: var(--signal-soft); color: var(--signal-ink); }

/* States */
.empty { position: absolute; inset: 0; display: grid; place-items: center; }
.empty .box { width: 520px; text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px; padding: 32px; display: grid; gap: 14px; }
.empty h2 { font: 700 30px/1.05 "IBM Plex Sans Condensed", sans-serif; margin: 0; }
.empty .formats { font: 400 12px/1.6 "IBM Plex Mono", monospace; color: var(--muted); }
.sk { background: var(--line); border-radius: 2px; display: block; }
.toast { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: 620px; background: var(--surface); border: 1px solid var(--error); border-left: 4px solid var(--error); border-radius: 4px; box-shadow: var(--shadow); padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: start; }
.toast h4 { margin: 0; font: 600 15px/1.3 "IBM Plex Sans", sans-serif; }
.toast p { margin: 0; color: var(--graphite); font-size: 13.5px; grid-column: 1; }
.toast code { font: 400 12px/1 "IBM Plex Mono", monospace; color: var(--muted); grid-column: 1; }
.missing { border: 2px dashed var(--warn); }
.badge { font: 600 11px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 2px; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.src { font-size: 13.5px; color: var(--muted); }
.input { border: 1px solid var(--signal); border-radius: 2px; padding: 10px 12px; box-shadow: 0 0 0 3px var(--signal-soft); }

/* Dialogs */
.scrim { position: absolute; inset: 0; background: rgba(20,19,17,.45); }
.dialog { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 620px; background: var(--surface); border: 1px solid var(--ink); border-radius: 4px; box-shadow: var(--shadow); display: grid; }
.dialog header { padding: 22px 26px 14px; border-bottom: 1px solid var(--line); }
.dialog header h2 { margin: 0; font: 700 26px/1.1 "IBM Plex Sans Condensed", sans-serif; }
.dialog header span { font: 500 11.5px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.dialog .body { padding: 18px 26px; display: grid; gap: 14px; }
.dialog footer { padding: 14px 26px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.check i { width: 20px; height: 20px; border: 1.5px solid var(--ok); color: var(--ok); display: grid; place-items: center; font: 700 12px/1 "IBM Plex Sans", sans-serif; font-style: normal; border-radius: 2px; }
.bigwarn { border: 3px solid var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 16px 18px; display: grid; grid-template-columns: 36px 1fr; gap: 6px 14px; }
.bigwarn .ico { grid-row: span 3; width: 36px; height: 36px; background: var(--warn); color: var(--surface); display: grid; place-items: center; font: 700 22px/1 "IBM Plex Sans Condensed", sans-serif; border-radius: 2px; }
.bigwarn h3 { margin: 0; font: 700 20px/1.15 "IBM Plex Sans Condensed", sans-serif; }
.bigwarn ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.linkrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line-strong); border-radius: 2px; padding: 8px 10px; }
.linkrow code { font: 400 13px/1 "IBM Plex Mono", monospace; }
.chip { font: 600 11px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 2px; border: 1px solid var(--line-strong); color: var(--graphite); }
.chip.sig { border-color: var(--signal); background: var(--signal-soft); color: var(--signal-ink); }
.snippet { background: var(--paper); border: 1px solid var(--line-strong); border-radius: 2px; padding: 12px; font: 400 12px/1.6 "IBM Plex Mono", monospace; }
.qr { width: 140px; height: 140px; background: #fff; border: 1px solid var(--line-strong); border-radius: 2px; padding: 8px; }
</style>

<main id="screens"></main>

<script>
function tile(size, bg, fg) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="3" fill="${bg}"/>` +
    `<path d="M10 11V8h12v8h-6v4" fill="none" stroke="${fg}" stroke-width="3.6" stroke-linecap="square"/><rect x="14.2" y="22.6" width="3.6" height="3.6" fill="${fg}"/></svg>`;
}
const T = {
  en: { survey: "Customer satisfaction 2026", saved: "Draft · saved", missing: "3 missing", preview: "Preview", publish: "Publish", search: "Search questions",
    pages: ["01 · Welcome", "02 · Your visit", "03 · About you"], qs: [["Welcome text", "INTRO"], ["How satisfied are you…", "SAT_1"], ["What could we improve?", "IMPROVE"], ["Would you recommend us?", "NPS"], ["Which branch?", "BRANCH"], ["Age group", "AGE"]],
    addpage: "+ Add page", foot: ["LOGIC  2 rules", "END    Thank-you page"], prog: ["PAGE 2 / 3 · YOUR VISIT", "02 / 03"],
    q: "How satisfied are you with our service?", help: "Please think about your last visit.", lo: "Very unsatisfied", hi: "Very satisfied", meta: "RATING SCALE · SAT_1 · REQUIRED", act: "Duplicate · Move · Delete",
    q2: "What could we improve?", ans: "Your answer", meta2: "LONG TEXT · IMPROVE · OPTIONAL", insert: "INSERT HERE", add: "+ Add question",
    filter: "rat", types: [["Single choice", "1"], ["Multiple choice", "2"], ["Rating scale", "3"], ["Net Promoter Score", "4"], ["Short text", "5"], ["Long text", "6"], ["Number", "7"], ["Date", "8"], ["Matrix", "9"], ["Ranking", "0"]],
    grid: "Grid", hint: "↑↓ choose · Enter insert · Esc close", tabs: ["Question", "Logic", "Translations"], typeLab: "Type", type: "Rating scale", vname: "Variable name", vnote: "Renaming keeps a mapping; exports stay stable.",
    scale: "Scale", scaleV: "1 to 5", l1: "Label at 1", l5: "Label at 5", req: "Required", rnd: "Randomise options", dk: "Show “Don't know”", shown: "Shown when", cond: "<b>Always</b> · Add a condition",
    tr: "Translations  DE 2/3 · EN 3/3", menu: [["In a side panel", "✓"], ["In a new tab", ""]] },
  de: { survey: "Kundenzufriedenheit 2026", saved: "Entwurf · gespeichert", missing: "3 fehlen", preview: "Vorschau", publish: "Veröffentlichen", search: "Fragen suchen",
    pages: ["01 · Willkommen", "02 · Ihr Besuch", "03 · Über Sie"], qs: [["Begrüßung", "INTRO"], ["Wie zufrieden sind Sie…", "SAT_1"], ["Was können wir verbessern?", "IMPROVE"], ["Würden Sie uns empfehlen?", "NPS"], ["Welche Filiale?", "BRANCH"], ["Altersgruppe", "AGE"]],
    addpage: "+ Seite hinzufügen", foot: ["LOGIK    2 Regeln", "ENDE     Dankeseite"], prog: ["SEITE 2 / 3 · IHR BESUCH", "02 / 03"],
    q: "Wie zufrieden sind Sie mit unserem Service?", help: "Bitte denken Sie an Ihren letzten Besuch.", lo: "Sehr unzufrieden", hi: "Sehr zufrieden", meta: "BEWERTUNGSSKALA · SAT_1 · PFLICHT", act: "Duplizieren · Verschieben · Löschen",
    q2: "Was können wir verbessern?", ans: "Ihre Antwort", meta2: "LANGTEXT · IMPROVE · OPTIONAL", insert: "HIER EINFÜGEN", add: "+ Frage hinzufügen",
    filter: "bew", types: [["Einfachauswahl", "1"], ["Mehrfachauswahl", "2"], ["Bewertungsskala", "3"], ["Net Promoter Score", "4"], ["Kurztext", "5"], ["Langtext", "6"], ["Zahl", "7"], ["Datum", "8"], ["Matrix", "9"], ["Rangfolge", "0"]],
    grid: "Raster", hint: "↑↓ wählen · Enter einfügen · Esc schließen", tabs: ["Frage", "Logik", "Übersetzungen"], typeLab: "Fragetyp", type: "Bewertungsskala", vname: "Variablenname", vnote: "Umbenennen behält eine Zuordnung; Exporte bleiben stabil.",
    scale: "Skala", scaleV: "1 bis 5", l1: "Beschriftung bei 1", l5: "Beschriftung bei 5", req: "Pflichtfrage", rnd: "Optionen mischen", dk: "„Weiß nicht“ anzeigen", shown: "Angezeigt, wenn", cond: "<b>Immer</b> · Bedingung hinzufügen",
    tr: "Übersetzungen  DE 2/3 · EN 3/3", menu: [["In einer Seitenleiste", "✓"], ["In einem neuen Tab", ""]] },
};
const css = (el, n) => getComputedStyle(el).getPropertyValue(n).trim();

function bar(L, lang, opts = {}) {
  return `<div class="bar"><span class="brandline"><span class="logo" data-logo></span><span class="sep"></span><span class="crumb">${L.survey}</span>
    <span class="stat${opts.bad ? " bad" : ""}">${opts.status ?? L.saved}</span></span><span class="grow"></span>
    <span class="seg"><span class="${lang === "de" ? "on" : ""}">DE</span><span class="${lang === "en" ? "on" : ""}">EN</span></span><span class="stat">${L.missing}</span><span class="grow"></span>
    <span class="kbd">Ctrl K</span><span class="btn quiet">${L.preview} ▾</span><span class="btn primary">${L.publish}</span></div>`;
}
function outline(L, sel = 1, missing = []) {
  const q = (i) => `<div class="q${i === sel ? " sel" : ""}"><span class="grip">⋮⋮</span><span>${L.qs[i][0]}${missing.includes(i) ? '<i class="miss"></i>' : ""}</span><code>${L.qs[i][1]}</code></div>`;
  return `<div class="outline"><div class="search"><span>${L.search}</span><span class="kbd">/</span></div>
    <div class="pg"><span>${L.pages[0]}</span><span>1</span></div>${q(0)}<div class="pg"><span>${L.pages[1]}</span><span>3</span></div>${q(1)}${q(2)}${q(3)}
    <div class="pg"><span>${L.pages[2]}</span><span>2</span></div>${q(4)}${q(5)}<div class="addpage">${L.addpage}</div>
    <div class="outfoot">${L.foot[0]}<br>${L.foot[1]}</div></div>`;
}
function inspector(L) {
  return `<div class="inspector"><div class="tabs"><span class="on">${L.tabs[0]}</span><span>${L.tabs[1]}</span><span>${L.tabs[2]}</span></div>
    <div><span class="lab">${L.typeLab}</span><div class="field"><span>${L.type}</span><span>▾</span></div></div>
    <div><span class="lab">${L.vname}</span><div class="field mono"><span>SAT_1</span><span class="stat">A–Z 0–9 _</span></div><div class="note">${L.vnote}</div></div>
    <div class="row2"><div><span class="lab">${L.scale}</span><div class="field"><span>${L.scaleV}</span><span>▾</span></div></div><div><span class="lab">Default</span><div class="field"><span>—</span></div></div></div>
    <div><span class="lab">${L.l1}</span><div class="field"><span>${L.lo}</span></div></div>
    <div><span class="lab">${L.l5}</span><div class="field"><span>${L.hi}</span></div></div>
    <div class="toggle"><b class="on"></b>${L.req}</div><div class="toggle"><b></b>${L.rnd}</div><div class="toggle"><b></b>${L.dk}</div>
    <div><span class="lab">${L.shown}</span><div class="cond">${L.cond}</div></div>
    <div class="stat" style="margin-top:auto">${L.tr}</div></div>`;
}
function canvas(L, opts = {}) {
  const scale = [1, 2, 3, 4, 5].map((n) => `<span>${n}</span>`).join("");
  return `<div class="canvas${opts.grid ? " grid" : ""}"><div class="page">
    <div><div class="prog"><span>${L.prog[0]}</span><span>${L.prog[1]}</span></div><div class="ruler"><i style="width:50%"></i></div></div>
    <div class="card sel"><div class="qno"><span>Q2 · SAT_1</span><span>★ ${L.req}</span></div><h3>${L.q} <span class="req">*</span><span class="caret"></span></h3><p>${L.help}</p>
      <div class="scale">${scale}</div><div class="ends"><span>${L.lo}</span><span>${L.hi}</span></div>
      <div class="cardfoot"><span>${L.meta}</span><span>${L.act}</span></div></div>
    <div class="insert"><b>+</b>${L.insert}</div>
    <div class="card"><div class="qno" style="color:var(--muted)"><span>Q3 · IMPROVE</span></div><h3>${L.q2}</h3><div class="area">${L.ans}</div></div>
    <div><span class="btn quiet">${L.add}</span></div>
    </div>${opts.menu ? typemenu(L) : ""}<span class="gridtoggle${opts.grid ? " on" : ""}" role="switch" aria-checked="${!!opts.grid}"><i></i>${L.grid}</span></div>`;
}
function typemenu(L) {
  return `<div class="typemenu"><div class="filter">${L.filter}<span class="caret" style="height:16px;vertical-align:-3px"></span></div><div class="grid">${L.types.map((t, i) => `<span class="${i === 2 ? "hl" : ""}">${t[0]}<code>${t[1]}</code></span>`).join("")}</div><div class="hint">${L.hint}</div></div>`;
}
function screen(id, theme, title, inner) {
  return `<section><p class="label">${title}</p><div class="wrap"><div class="screen t-${theme}" id="${id}">${inner}</div></div></section>`;
}

const qr = document.getElementById("qr");
if (qr) {
  let cells = "";
  for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) {
    const f = (x < 7 && y < 7) || (x > 21 && y < 7) || (x < 7 && y > 21);
    const ring = f && ((x % 22 === 0 || x % 22 === 6 || y % 22 === 0 || y % 22 === 6) || (x % 22 >= 2 && x % 22 <= 4 && y % 22 >= 2 && y % 22 <= 4));
    if ((f && ring) || (!f && (x * 7 + y * 13 + x * y) % 5 === 0)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  qr.innerHTML = `<g fill="#1a1917">${cells}</g>`;
