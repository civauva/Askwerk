  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 400; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans-condensed/files/ibm-plex-sans-condensed-latin-400-normal.woff2"); }

  :root { --ink: #1a1917; --graphite: #4d4a45; --muted: #8a877f; --line: #e5e2db; --line-strong: #cfcac0; --paper: #f5f3ef; --surface: #fff; --signal: #d1440f;
          --font: "IBM Plex Sans", system-ui, sans-serif; --display: "IBM Plex Sans Condensed", var(--font); --mono: "IBM Plex Mono", monospace; --side: 232px; --bar: 56px; }

</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const v = q.get("v") || "a", s = q.get("s") || "list";
const W = 2560, SIDE = 232, PAD = 32, space = W - SIDE;
// The content column per variant: left x and width (list = groups panel + table; form = 720 px fields + 240 px labels).
const listWidth = { a: 1200, b: 1200, c: space - 2 * PAD, d: null, e: 1600 }[v];
const formWidth = { a: 984, b: 984, c: space - 2 * PAD, d: 984, e: 984 }[v];
const width = s === "list" ? listWidth : formWidth;
const centred = v === "b" || (v === "d" && s === "form");
let left = SIDE + PAD, right;
if (centred) { left = SIDE + (space - width) / 2; }
right = left + width;
const nav = `<div class="side"><div class="side-head">Ask<span>werk</span></div><div class="org"><i>AG</i>Acme GmbH ▾</div>
  <div class="nav">Surveys</div><div class="nav">Templates</div><div class="grp">ADMINISTRATION</div>
  <div class="nav ${s === "form" ? "on" : ""}">Organisation</div><div class="nav">Members</div><div class="nav ${s === "list" ? "on" : ""}">Contacts</div><div class="nav">Connections</div><div class="nav">Sign-in</div><div class="nav">Looks</div><div class="nav">Messages</div><div class="nav">Domains</div><div class="nav">Developers &amp; API</div></div>`;
const title = s === "list" ? "Contacts" : "Organisation";
const actions = s === "list" ? `<span class="btn">Export</span><span class="btn">Import</span><span class="btn primary">+ Add contact</span>` : `<span class="btn primary">Save</span>`;
// The bar: B and D (form) follow the centred column; the others put the path at the content's left edge and the actions at the window's right edge.
const barLeft = left - SIDE, barRight = centred ? W - right : PAD;
const bar = `<div class="bar"><div class="bar-in" style="left:${barLeft}px;right:${barRight}px"><span class="crumbs">Administration<span class="sep">›</span><b>${title}</b></span><span class="grow"></span>${actions}</div></div>`;
const rows = [["Lena Gruber","lena.gruber@example.at","CRM-10442","Key accounts","Sales","3 · answered 3","2 Oct"],["Thomas Huber","t.huber@example.com","CRM-10871","Key accounts","Sales","2 · answered 1","2 Oct"],["Sarah Novak","sarah.novak@example.org","CRM-11003","Event Vienna 2026","Service","4 · answered 2","2 Oct"],["Anja Weber","anja.weber@example.de","CRM-11210","Customers Q4","Sales","1 · answered 1","2 Oct"],["Jakob Steiner","jakob@steiner.example","HR-0077","Staff","IT","2 · answered 0","28 Sep"],["Maria Pichler","m.pichler@example.at","CRM-11502","Customers Q4","Service","1 · answered 1","27 Sep"],["Lukas Bauer","l.bauer@example.com","CRM-11688","Key accounts","Sales","3 · answered 2","25 Sep"],["Eva Hofer","eva.hofer@example.at","HR-0102","Staff","HR","2 · answered 2","24 Sep"]];
const table = `<table><tr><th>Person</th><th>External ID</th><th>Groups</th><th>Department</th><th>Surveys</th><th>Last invited</th><th>Can be invited</th></tr>
  ${rows.map((r) => `<tr><td><b>${r[0]}</b><small>${r[1]}</small></td><td>${r[2]}</td><td><span class="chip">${r[3]}</span></td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>Yes</td></tr>`).join("")}</table>`;
const groups = `<div class="panel"><p class="h">GROUPS</p><div class="on">All contacts <small>1,284</small></div><div>Customers Q4 <small>201</small></div><div>Key accounts <small>48</small></div><div>Staff <small>312</small></div><div>Event Vienna 2026 <small>530</small></div></div>`;
const tools = `<div class="tools"><span class="input">Search contacts…</span><span class="pill on">All</span><span class="pill">Can be invited 1,251</span><span class="pill">Unsubscribed 21</span><span class="pill">Bounced 12</span></div>`;
const head = `<h1>${title}</h1><p class="lead">${s === "list" ? "The organisation's address book: invite the same people to many surveys, keep their fields, respect who unsubscribed." : "Acme GmbH since 12 Oct 2026 · 12 members · 24 surveys."}</p>`;
let main;
if (s === "list" && v === "d") {
  // D: the side panel stays at the left edge like the survey editor's outline; the list is centred in the rest.
  const panelLeft = SIDE + PAD, listLeft = panelLeft + 220 + 18, rest = W - PAD - listLeft, listW = 1200, listX = listLeft + (rest - listW) / 2;
  main = `<div class="main" style="left:${panelLeft}px;width:220px;top:${56 + 28 + 70}px">${groups}</div>
    <div class="main" style="left:${listX}px;width:${listW}px">${head}${tools}${table}</div>
    <div class="guide" style="left:${listX}px"></div><div class="guide" style="left:${listX + listW}px"></div>`;
  document.body.dataset.bar = JSON.stringify({ l: panelLeft });
} else if (s === "list") {
  main = `<div class="main" style="left:${left}px;width:${width}px">${head}<div class="work">${groups}<div>${tools}${table}</div></div></div>
    <div class="guide" style="left:${left}px"></div><div class="guide" style="left:${right}px"></div>`;
} else {
  const sections = [["Name and mark","How the organisation appears to members and respondents.",["Name","Acme GmbH"],["Short name","acme"]],["Address for survey links","The address respondents see.",["Primary address","surveys.acme.at"]],["Language and region","Defaults for new surveys and dates.",["Language","English"],["Time zone","Europe/Vienna"]]];
  const fieldsMax = v === "c" ? "720px" : "none";
  main = `<div class="main" style="left:${left}px;width:${width}px">${head}${sections.map(([h, p, ...fields]) => `<div class="section"><div><h2>${h}</h2><p>${p}</p></div><div style="max-width:${fieldsMax}">${fields.map(([l, val]) => `<div class="field"><label>${l}</label><span>${val}</span></div>`).join("")}</div></div>`).join("")}</div>
    <div class="guide" style="left:${left}px"></div><div class="guide" style="left:${right}px"></div>`;
}
const notes = {
  a: "A · Left, as today. Lists stop at 1,200 px, forms at 984 px (labels 240 + fields 720); the title stays next to the sidebar. The bar's path starts with the content, its actions sit at the window's right edge. At 2,560 px about 1,100 px stay free on the right.",
  b: "B · Centred column, same widths as A (nothing squeezed). The column sits in the middle of the space beside the sidebar; the bar's path and actions follow the column, so the buttons stay above the content.",
  c: "C · Full width. Lists and their table use the whole width (more room for columns and long names); forms keep their fields at 720 px, so a section's label and fields stay readable while the page itself spans the window.",
  d: "D · Like the survey editor. Panels stay at the edges (here the groups, like the editor's page list); the main content is centred in the space between, at 1,200 px. Forms without a panel are centred like B.",
  e: "E · Left, but wider lists. Lists may grow to 1,600 px before they stop (more of a table fits on big screens), forms stay at 984 px; otherwise as A.",
};
document.getElementById("app").innerHTML = nav + bar + main + `<div class="tag">${v.toUpperCase()} · ${s === "list" ? "list page" : "form page"}</div><div class="note">${notes[v]}</div>`;
if (s === "list" && v === "d") {
  // D's bar: path at the panel's left edge, actions at the window's right edge.
  document.querySelector(".bar-in").style.left = `${PAD}px`;
  document.querySelector(".bar-in").style.right = `${PAD}px`;
}
</script>
