<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<!-- W45 (AWK-71): Simple and Advanced views. ?s=views (what each shows) | ?s=switch (three places to switch). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>W45 Simple and Advanced</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 400; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans-condensed/files/ibm-plex-sans-condensed-latin-400-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 700; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans-condensed/files/ibm-plex-sans-condensed-latin-700-normal.woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2"); }
  :root { --ink: #1a1917; --graphite: #4d4a45; --muted: #8a877f; --line: #e5e2db; --line-strong: #cfcac0; --paper: #f5f3ef; --signal: #d1440f; --soft: #efede8;
          --font: "IBM Plex Sans", system-ui, sans-serif; --display: "IBM Plex Sans Condensed", var(--font); --mono: "IBM Plex Mono", monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; width: 1440px; background: #dedad2; color: var(--ink); font: 400 14px/1.45 var(--font); }
  h1.sheet { margin: 0 0 6px; font: 700 24px/1.2 var(--display); } p.intro { margin: 0 0 16px; color: var(--graphite); font-size: 13px; max-width: 1180px; }
  .row { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
  .opt h2 { margin: 0 0 2px; font: 700 17px/1.2 var(--display); } .opt p { margin: 0 0 8px; font-size: 13px; color: var(--graphite); max-width: 640px; min-height: 36px; }
  .frame { position: relative; background: var(--paper); border: 1px solid var(--line-strong); overflow: hidden; }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 600px; }
  .side { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .side-head { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--line); font: 700 19px/1 var(--display); } .side-head b { color: var(--signal); }
  .tile { width: 20px; height: 20px; border-radius: 3px; background: var(--signal); color: #fff; display: grid; place-items: center; font: 700 13px var(--display); }
  .org { margin: 12px; display: flex; gap: 9px; align-items: center; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; font-weight: 600; font-size: 13.5px; }
  .org i { width: 24px; height: 24px; border-radius: 6px; background: var(--ink); color: #fff; display: grid; place-items: center; font: 600 9.5px var(--mono); font-style: normal; }
  .nav { padding: 7px 22px; color: var(--graphite); font-size: 14px; display: flex; justify-content: space-between; } .nav.on { margin: 0 12px; padding: 7px 10px; background: var(--soft); border-radius: 6px; color: var(--ink); font-weight: 600; }
  .nav.new { color: var(--muted); }
  .grp { margin: 12px 20px 4px; font: 500 10.5px var(--mono); letter-spacing: .08em; color: var(--muted); }
  .grow { flex: 1; }
  .more { margin: 4px 12px; padding: 7px 10px; color: var(--graphite); font-size: 13px; border-top: 1px dashed var(--line); }
  .more b { color: var(--signal); font-weight: 600; }
  .me { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; font-size: 13px; } .me i { width: 28px; height: 28px; border-radius: 50%; background: #3d4147; color: #fff; display: grid; place-items: center; font: 600 11px var(--font); font-style: normal; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .bar { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); }
  .crumbs { font: 400 17px/1.2 var(--display); color: var(--graphite); } .crumbs b { color: var(--ink); }
  .btn { padding: 7px 13px; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; font-weight: 600; font-size: 13px; white-space: nowrap; } .btn.primary { background: var(--signal); border-color: var(--signal); color: #fff; }
  .body { padding: 22px 24px; } .body h3 { margin: 0 0 4px; font: 700 26px/1.1 var(--display); } .body p { margin: 0 0 14px; color: var(--graphite); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; height: 120px; padding: 12px; font-weight: 600; }
  /* switches */
  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
  .seg span { padding: 4px 10px; border-radius: 999px; font: 600 12px/1 var(--font); color: var(--graphite); } .seg .on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .sideswitch { margin: 8px 12px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--graphite); }
  .menu { position: absolute; left: 12px; bottom: 58px; width: 250px; padding: 6px; background: #fff; border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.14); z-index: 3; }
  .menu div { padding: 8px 10px; border-radius: 5px; font-size: 13.5px; display: flex; justify-content: space-between; } .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; } .menu .hint { color: var(--muted); font: 500 11px var(--mono); }
  .toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 9px 14px; background: var(--ink); color: #fff; border-radius: 8px; font-size: 13px; display: flex; gap: 14px; align-items: center; }
  .toast u { color: #ffb38f; }
  /* look */
  .look { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  .lside { background: #fff; border-right: 1px solid var(--line); }
  .tabs { display: flex; gap: 16px; padding: 12px 16px 0; border-bottom: 1px solid var(--line); } .tabs span { padding-bottom: 8px; font-size: 13px; color: var(--graphite); } .tabs .on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--ink); }
  .field { padding: 10px 16px; font-size: 12.5px; color: var(--graphite); } .dots { display: flex; gap: 6px; margin-top: 6px; } .dots i { width: 22px; height: 22px; border-radius: 50%; } .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; } .tiles span { height: 44px; border: 1px solid var(--line-strong); border-radius: 6px; display: grid; place-items: center; font-size: 11.5px; }
  .stage { background: repeating-conic-gradient(#eeece8 0 25%, #f5f3ef 0 50%) 0 0 / 22px 22px; padding: 18px; } .page { background: #fff; border-radius: 10px; height: 100%; padding: 22px; font: 600 18px Georgia, serif; }
  .note { margin: 10px 16px; padding: 8px 10px; border: 1px dashed var(--line-strong); border-radius: 6px; font-size: 12px; color: var(--graphite); } .note b { color: var(--signal); }
  .badge { position: absolute; bottom: 10px; right: 10px; padding: 3px 9px; background: var(--ink); color: #fff; font: 600 12px var(--mono); border-radius: 4px; }
</style>
</head>
<body>
<script>
const s = new URLSearchParams(location.search).get("s") || "views";
const navSimple = ["Surveys", "Templates"];
const adminSimple = ["Organisation", "Members", "Looks"];
const adminAll = ["Organisation", "Members", "Contacts", "Connections", "Sign-in", "Looks", "Messages", "Domains", "Developers & API"];
const side = (mode, extra = "", foot = "") => `<div class="side"><div class="side-head"><span class="tile">?</span>ask<b>werk</b></div><div class="org"><i>DM</i>Direct Mind GmbH ▾</div>
  ${navSimple.map((n, i) => `<div class="nav ${i === 0 ? "on" : ""}">${n}</div>`).join("")}
  <div class="grp">ADMINISTRATION</div>${(mode === "simple" ? adminSimple : adminAll).map((n) => `<div class="nav">${n}</div>`).join("")}
  ${mode === "simple" ? '<div class="more">6 more places · <b>Switch to Advanced</b></div>' : ""}
  <div class="grow"></div>${extra}<div class="me"><i>DK</i><div><b>Drazan Kosic</b><br><span style="color:var(--muted)">owner</span></div></div>${foot}</div>`;
const surveys = (bar = "") => `<div class="main"><div class="bar"><span class="crumbs"><b>Surveys</b></span><span class="grow"></span>${bar}<span class="btn primary">+ New survey</span></div><div class="body"><h3>Surveys</h3><p>of Direct Mind GmbH</p><div class="cards"><div class="card">Your stay in the mountains</div><div class="card">Where is your next journey?</div><div class="card">Supplier assessment 2026</div></div></div></div>`;
const lookSide = (mode) => mode === "simple"
  ? `<div class="lside"><div class="tabs"><span class="on">Style</span></div><div class="field">Accent colour<div class="dots"><i style="background:#2f6f4a"></i><i style="background:#c3401f"></i><i style="background:#1f5f8b"></i><i style="background:#7a55e0"></i></div></div><div class="field">Type<div class="tiles"><span>Sans</span><span>Condensed</span><span>Serif</span></div></div><div class="field">Shape<div class="tiles"><span>Sharp</span><span>Rounded</span><span>Pill</span></div></div><div class="note">Colours, parts, pages, email &amp; PDF: <b>Switch to Advanced</b></div></div>`
  : `<div class="lside"><div class="tabs"><span class="on">Style</span><span>Parts</span><span>Pages</span><span>Email &amp; PDF</span></div><div class="field">Accent colour<div class="dots"><i style="background:#2f6f4a"></i><i style="background:#c3401f"></i><i style="background:#1f5f8b"></i><i style="background:#7a55e0"></i></div></div><div class="field">Type<div class="tiles"><span>Sans</span><span>Condensed</span><span>Serif</span></div></div><div class="field">Shape<div class="tiles"><span>Sharp</span><span>Rounded</span><span>Pill</span></div></div><div class="field">Background<div class="tiles"><span>Colour</span><span>Pattern</span><span>Picture</span></div></div></div>`;
const look = (mode) => `<div class="look">${lookSide(mode)}<div class="stage"><div class="page">Your stay in the mountains</div></div></div>`;
const frame = (inner, badge) => `<div class="frame app">${inner}<span class="badge">${badge}</span></div>`;
let html = "";
if (s === "views") {
  html = `<h1 class="sheet">W45 · AWK-71 · Simple and Advanced: what each shows</h1><p class="intro">Per person; new people start in Simple. Simple hides whole places, never single buttons inside a page, and loses nothing: what is set elsewhere keeps working, search (Ctrl K) still finds every place, and "Switch to Advanced" is always one click away. Rights stay as they are: Advanced shows only what the person may use.</p>
  <div class="row"><div class="opt"><h2>Simple · the sidebar</h2><p>Surveys and Templates; under Administration only Organisation, Members and Looks. A quiet line says how many places are hidden.</p>${frame(side("simple") + surveys(), "SIMPLE")}</div>
  <div class="opt"><h2>Advanced · the sidebar</h2><p>Everything the person's role allows, as today.</p>${frame(side("all") + surveys(), "ADVANCED")}</div></div>
  <div class="row"><div class="opt"><h2>Simple · a survey's Look</h2><p>Style only: accent colour, type, shape. The other tabs wait behind "Switch to Advanced". Questions: the inspector shows the common settings (text, required, options); logic, variables and scoring stay hidden.</p>${frame(side("simple") + `<div class="main"><div class="bar"><span class="crumbs">Surveys › Mountain lodge › <b>Look</b></span></div>${look("simple")}</div>`, "SIMPLE")}</div>
  <div class="opt"><h2>Advanced · a survey's Look</h2><p>All four tabs, as today.</p>${frame(side("all") + `<div class="main"><div class="bar"><span class="crumbs">Surveys › Mountain lodge › <b>Look</b></span></div>${look("all")}</div>`, "ADVANCED")}</div></div>`;
}
if (s === "switch") {
  const sw = (on) => `<span class="seg"><span class="${on === "simple" ? "on" : ""}">Simple</span><span class="${on === "all" ? "on" : ""}">Advanced</span></span>`;
  html = `<h1 class="sheet">W45 · AWK-71 · Switching between Simple and Advanced</h1><p class="intro">Switching is instant and remembered per person. After a switch, a short note says what changed and offers to switch back. In every option, Ctrl K → "Advanced view" / "Simple view" switches too.</p>
  <div class="row"><div class="opt"><h2>A · At the sidebar's foot, always visible</h2><p>A small two-way switch above the person, one click from anywhere. The most discoverable; costs one line of the sidebar.</p>${frame(side("simple", `<div class="sideswitch">View ${sw("simple")}</div>`) + surveys(), "A")}</div>
  <div class="opt"><h2>B · In the top bar, next to the language</h2><p>The same switch at the bar's right end on every page; visible while working, also inside a survey. Competes with each page's actions.</p>${frame(side("simple") + surveys(sw("simple")), "B")}</div></div>
  <div class="row"><div class="opt"><h2>C · In the person's menu</h2><p>Click your name: "View: Simple ✓ / Advanced". Tidiest, but hidden one click deep; the "Switch to Advanced" line in the sidebar remains the visible way in.</p>${frame(side("simple") + surveys() + `<div class="menu"><div><b>Drazan Kosic</b></div><hr><div>View<span class="hint">SIMPLE</span></div><div style="padding-left:24px">✓ Simple</div><div style="padding-left:24px">Advanced</div><hr><div>Account and security</div><div>Sign out</div></div>`, "C")}</div>
  <div class="opt"><h2>After switching (all options)</h2><p>A note at the bottom for a few seconds: what changed, and Undo. Hidden places appear in their usual spots; nothing moves.</p>${frame(side("all") + surveys() + `<div class="toast">Advanced view: 6 more places in the sidebar, all Look tabs. <u>Undo</u></div>`, "NOTE")}</div></div>`;
}
document.body.innerHTML = html;
</script>
</body>
</html>
