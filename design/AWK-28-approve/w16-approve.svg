  <text x="830" y="896" font-size="12" font-weight="600" fill="#111" text-anchor="start">Anna Berger</text>
  <text x="930" y="896" font-size="11.5" font-weight="400" fill="#333" text-anchor="start" font-family="Consolas, monospace">survey.published</text>
  <text x="1120" y="896" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">v4 · draft 7f3a91c2 (approved)</text>
  <text x="714" y="932" font-size="11.5" font-weight="400" fill="#555" text-anchor="start" font-family="Consolas, monospace">yesterday 16:40</text>
  <text x="830" y="932" font-size="12" font-weight="600" fill="#111" text-anchor="start">Clara Wolf</text>
  <text x="930" y="932" font-size="11.5" font-weight="400" fill="#333" text-anchor="start" font-family="Consolas, monospace">survey.approval-withdrawn</text>
  <text x="1120" y="932" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">draft 1b0e44d7</text>
  <circle cx="1470" cy="860" r="10" fill="#444"/>
  <text x="1470" y="864" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="40" y="1010" font-size="12" font-weight="400" fill="#333" text-anchor="start">1 Approve… sits in the Preview side panel's header, from the editor and from Results. Preview in a new tab shows the survey only, as today.</text>
  <text x="40" y="1032" font-size="12" font-weight="400" fill="#333" text-anchor="start">2 After approving, the header says so for this draft; Withdraw takes it back (audited).</text>
  <text x="40" y="1054" font-size="12" font-weight="400" fill="#333" text-anchor="start">3 One step: what is approved (the saved draft, its time, languages and size) and an optional note. The approval is pinned to that exact content (a fingerprint of the draft).</text>
  <text x="40" y="1076" font-size="12" font-weight="400" fill="#333" text-anchor="start">4 Editors see the state next to Publish: approved this draft, approved an earlier draft (changed since), or not approved. The pill opens the list of approvals.</text>
  <text x="40" y="1098" font-size="12" font-weight="400" fill="#333" text-anchor="start">5 The Publish dialog says whether the draft is approved; publishing never waits for it. The published version keeps the approvals of its draft.</text>
  <text x="40" y="1120" font-size="12" font-weight="400" fill="#333" text-anchor="start">6 Approve, withdraw and publish are in the audit log with the draft's fingerprint, so a published version can be traced to its approval.</text>
  <text x="40" y="1142" font-size="12" font-weight="400" fill="#333" text-anchor="start">Email and PDF: unchanged. The PDF prints what is approved; it has no approval stamp.</text>
  <text x="40" y="1164" font-size="12" font-weight="600" fill="#333" text-anchor="start">Open for Dražan: (a) every member may approve (recommended), or only owners, admins and analysts; (b) publishing does not require an approval (recommended),</text>
  <text x="40" y="1186" font-size="12" font-weight="600" fill="#333" text-anchor="start">or an organisation setting “Publish only approved drafts”; (c) an approver may not approve their own changes (recommended: no such rule now).</text>
</svg>
