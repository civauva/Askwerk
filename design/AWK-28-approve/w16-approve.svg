  <rect x="700" y="664" width="420" height="120" rx="4" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="716" y="688" font-size="10.5" font-weight="700" fill="#666" text-anchor="start">APPROVALS</text>
  <text x="716" y="712" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">Ben Huber</text>
  <text x="820" y="712" font-size="12" font-weight="400" fill="#555" text-anchor="start">today 10:50 · this draft</text>
  <text x="820" y="726" font-size="11" font-weight="400" fill="#888" text-anchor="start">“checked with the works council”</text>
  <text x="716" y="746" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">Clara Wolf</text>
  <text x="820" y="746" font-size="12" font-weight="400" fill="#555" text-anchor="start">yesterday 16:20 · earlier draft</text>
  <text x="1140" y="710" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">Click the pill: every approval of this survey,</text>
  <text x="1140" y="728" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">newest first, with its note.</text>
  <text x="40" y="820" font-size="13" font-weight="600" fill="#444" text-anchor="start">D · Publish dialog (W5): one line, nothing to do</text>
  <rect x="40" y="830" width="620" height="150" rx="4" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="60" y="862" font-size="16" font-weight="600" fill="#111" text-anchor="start">Publish version 4</text>
  <text x="640" y="862" font-size="14" font-weight="600" fill="#555" text-anchor="end">✕</text>
  <text x="60" y="894" font-size="12.5" font-weight="600" fill="#333" text-anchor="start">✓ Approved by Ben Huber for this draft.</text>
  <text x="60" y="918" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">Publishing does not wait for an approval; the line only says what there is.</text>
