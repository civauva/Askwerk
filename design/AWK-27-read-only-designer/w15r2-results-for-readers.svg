<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1092" width="1500" height="1092" font-family="Segoe UI, Arial, sans-serif">
  <!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <!-- W15 rev. 2 AWK-27 analysts and viewers open Results -->
  <rect x="0" y="0" width="1500" height="1092" fill="#fafafa"/>
  <text x="24" y="36" font-size="20" font-weight="600" fill="#111" text-anchor="start">W15 rev. 2 · Analysts and viewers: Results, Preview and PDF instead of the editor · AWK-27 · 2026-10-15 · supersedes W15</text>
  <text x="24" y="60" font-size="12.5" font-weight="400" fill="#444" text-anchor="start">No read-only designer. Whoever may not edit a survey opens its Results; Preview and the PDF are in the top bar. Results itself is W11, unchanged.</text>
  <text x="40" y="84" font-size="13" font-weight="600" fill="#444" text-anchor="start">A · Analyst opens a survey from the list → its Results · EN · desktop</text>
  <rect x="40" y="94" width="1420" height="330" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="40" y="94" width="1420" height="48" rx="0" fill="#eee" stroke="#ccc" stroke-width="1.2"/>
  <rect x="54" y="108" width="20" height="20" rx="3" fill="#555" stroke="none" stroke-width="1.2"/>
  <text x="82" y="123" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">askwerk  |  Customer satisfaction 2026</text>
  <rect x="370" y="110" width="97.19999999999999" height="19" rx="10" fill="#eee" stroke="#999" stroke-width="1.2"/>
  <text x="418.6" y="124" font-size="10.5" font-weight="700" fill="#333" text-anchor="middle">Published v3</text>
