  <text x="582" y="489" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">askwerk  |  Mitarbeiterbefragung Q4</text>
  <rect x="870" y="476" width="64.19999999999999" height="19" rx="10" fill="#eee" stroke="#999" stroke-width="1.2"/>
  <text x="902.1" y="490" font-size="10.5" font-weight="700" fill="#333" text-anchor="middle">Entwurf</text>
  <rect x="1306" y="469" width="130" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="1371.0" y="489.0" font-size="12" font-weight="600" fill="#111" text-anchor="middle">PDF herunterladen</text>
  <rect x="1186" y="469" width="110" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="1241.0" y="489.0" font-size="12" font-weight="600" fill="#111" text-anchor="middle">Vorschau ▾</text>
  <text x="1106" y="490" font-size="12" font-weight="600" fill="#444" text-anchor="start">DE | EN</text>
  <text x="1000" y="550" font-size="12.5" font-weight="400" fill="#333" text-anchor="middle">Noch keine Ergebnisse. Sie kommen, sobald die Umfrage veröffentlicht ist.</text>
  <text x="1000" y="574" font-size="12.5" font-weight="400" fill="#666" text-anchor="middle">Bis dahin zeigt die Vorschau, wie sie aussehen wird.</text>
  <circle cx="1440" cy="520" r="10" fill="#444"/>
  <text x="1440" y="524" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="40" y="670" font-size="13" font-weight="600" fill="#444" text-anchor="start">D · Who opens what</text>
  <rect x="40" y="684" width="820" height="34" rx="0" fill="#e8e8e8" stroke="#bbb" stroke-width="1.2"/>
  <text x="50" y="706" font-size="10.5" font-weight="700" fill="#666" text-anchor="start">ROLE</text>
  <text x="220" y="706" font-size="10.5" font-weight="700" fill="#666" text-anchor="start">OPENS A SURVEY</text>
  <text x="520" y="706" font-size="10.5" font-weight="700" fill="#666" text-anchor="start">EDIT TAB</text>
  <text x="630" y="706" font-size="10.5" font-weight="700" fill="#666" text-anchor="start">PREVIEW, PDF</text>
  <text x="770" y="706" font-size="10.5" font-weight="700" fill="#666" text-anchor="start">EXPORT</text>
  <rect x="40" y="718" width="820" height="34" rx="0" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
  <text x="50" y="740" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">Owner, admin, editor</text>
  <text x="220" y="740" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">the editor (W4), as today</text>
  <text x="520" y="740" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">yes</text>
  <text x="630" y="740" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">yes</text>
  <text x="770" y="740" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">yes</text>
  <rect x="40" y="752" width="820" height="34" rx="0" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
  <text x="50" y="774" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">Analyst</text>
  <text x="220" y="774" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">its Results</text>
  <text x="520" y="774" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">no</text>
  <text x="630" y="774" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">yes</text>
  <text x="770" y="774" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">yes</text>
  <rect x="40" y="786" width="820" height="34" rx="0" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
  <text x="50" y="808" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">Viewer</text>
  <text x="220" y="808" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">its Results</text>
  <text x="520" y="808" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">no</text>
  <text x="630" y="808" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">yes</text>
  <text x="770" y="808" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">no</text>
  <circle cx="880" cy="744" r="10" fill="#444"/>
  <text x="880" y="748" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="40" y="860" font-size="13" font-weight="600" fill="#444" text-anchor="start">For comparison, an editor's bar on the same page: the Edit tab as today, Preview and PDF here too</text>
  <rect x="40" y="870" width="1420" height="48" rx="0" fill="#eee" stroke="#ccc" stroke-width="1.2"/>
  <rect x="54" y="884" width="20" height="20" rx="3" fill="#555" stroke="none" stroke-width="1.2"/>
  <text x="82" y="899" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">askwerk  |  Customer satisfaction 2026</text>
  <rect x="370" y="886" width="97.19999999999999" height="19" rx="10" fill="#eee" stroke="#999" stroke-width="1.2"/>
  <text x="418.6" y="900" font-size="10.5" font-weight="700" fill="#333" text-anchor="middle">Published v3</text>
  <rect x="1350" y="879" width="96" height="30" rx="4" fill="#555" stroke="#555" stroke-width="1.2"/>
  <text x="1398.0" y="899.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Export</text>
  <rect x="1210" y="879" width="130" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="1275.0" y="899.0" font-size="12" font-weight="600" fill="#111" text-anchor="middle">Download PDF</text>
  <rect x="1090" y="879" width="110" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="1145.0" y="899.0" font-size="12" font-weight="600" fill="#111" text-anchor="middle">Preview ▾</text>
  <text x="1010" y="900" font-size="12" font-weight="600" fill="#444" text-anchor="start">DE | EN</text>
  <rect x="820" y="879" width="170" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <rect x="905" y="879" width="85" height="30" rx="4" fill="#555" stroke="#555" stroke-width="1.2"/>
  <text x="862" y="899" font-size="12.5" font-weight="600" fill="#111" text-anchor="middle">Edit</text>
  <text x="947" y="899" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Results</text>
  <text x="40" y="940" font-size="12" font-weight="400" fill="#333" text-anchor="start">1 Analysts and viewers get no Edit tab and never see the editor. In the survey list their row and title open Results; a link to the editor (/surveys/{id}) also leads there.</text>
  <text x="40" y="962" font-size="12" font-weight="400" fill="#333" text-anchor="start">2 Preview (side panel or new tab, as W9) and Download PDF move into the Results bar for them. Preview shows the current draft, so a review before publishing works; it stores nothing.</text>
  <text x="40" y="984" font-size="12" font-weight="400" fill="#333" text-anchor="start">3 Before publishing, Results says results come later and Preview shows the survey; the server allows Preview to every member (today editors only).</text>
  <text x="40" y="1006" font-size="12" font-weight="400" fill="#333" text-anchor="start">4 Analysts keep Export (W11, W14); viewers read results only, as today.</text>
  <text x="40" y="1028" font-size="12" font-weight="400" fill="#333" text-anchor="start">Variable names and codes are in every export's codebook; question settings and logic rules stay in the editor, for editors.</text>
  <text x="40" y="1050" font-size="12" font-weight="400" fill="#333" text-anchor="start">Email and PDF: unchanged.</text>
</svg>
