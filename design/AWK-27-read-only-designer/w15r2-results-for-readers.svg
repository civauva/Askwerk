  <rect x="1090" y="103" width="110" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="1145.0" y="123.0" font-size="12" font-weight="600" fill="#111" text-anchor="middle">Preview ▾</text>
  <text x="1010" y="124" font-size="12" font-weight="600" fill="#444" text-anchor="start">DE | EN</text>
  <circle cx="1140" cy="154" r="10" fill="#444"/>
  <text x="1140" y="158" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="64" y="180" font-size="20" font-weight="600" fill="#111" text-anchor="start">248 responses</text>
  <text x="220" y="180" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">212 complete · 36 partial · median 4 min</text>
  <rect x="64" y="194" width="90.0" height="26" rx="13" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="109.0" y="212" font-size="11.5" font-weight="600" fill="#333" text-anchor="middle">Complete ▾</text>
  <rect x="162.0" y="194" width="90.0" height="26" rx="13" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="207.0" y="212" font-size="11.5" font-weight="600" fill="#333" text-anchor="middle">All time ▾</text>
  <rect x="260.0" y="194" width="116.39999999999999" height="26" rx="13" fill="#fff" stroke="#999" stroke-width="1.2"/>
  <text x="318.2" y="212" font-size="11.5" font-weight="600" fill="#333" text-anchor="middle">All versions ▾</text>
  <text x="1220" y="212" font-size="13" font-weight="600" fill="#444" text-anchor="start">Overview   Responses</text>
  <rect x="340" y="244" width="820" height="150" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  <text x="360" y="272" font-size="14" font-weight="600" fill="#111" text-anchor="start">1  How satisfied are you with our service?</text>
  <rect x="380" y="354" width="46" height="20" rx="0" fill="#bbb" stroke="none" stroke-width="1.2"/>
  <rect x="450" y="339" width="46" height="35" rx="0" fill="#bbb" stroke="none" stroke-width="1.2"/>
  <rect x="520" y="314" width="46" height="60" rx="0" fill="#bbb" stroke="none" stroke-width="1.2"/>
  <rect x="590" y="284" width="46" height="90" rx="0" fill="#bbb" stroke="none" stroke-width="1.2"/>
  <rect x="660" y="304" width="46" height="70" rx="0" fill="#bbb" stroke="none" stroke-width="1.2"/>
  <text x="360" y="314" font-size="11.5" font-weight="400" fill="#888" text-anchor="start">(the overview of W11, unchanged)</text>
  <text x="40" y="450" font-size="13" font-weight="600" fill="#444" text-anchor="start">B · Preview ▾ and Download PDF · same as in the editor (W9)</text>
  <rect x="40" y="460" width="460" height="170" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="60" y="476" width="110" height="30" rx="4" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="115.0" y="496.0" font-size="12" font-weight="600" fill="#111" text-anchor="middle">Preview ▾</text>
  <rect x="60" y="512" width="230" height="96" rx="4" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="76" y="538" font-size="12.5" font-weight="600" fill="#111" text-anchor="start">In a side panel</text>
  <text x="76" y="562" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">In a new tab</text>
  <text x="76" y="586" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">As PDF</text>
  <text x="310" y="538" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">The draft as it is now; a banner</text>
  <text x="310" y="556" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">says answers are not saved.</text>
  <circle cx="480" cy="490" r="10" fill="#444"/>
  <text x="480" y="494" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="540" y="450" font-size="13" font-weight="600" fill="#444" text-anchor="start">C · A survey not published yet (DE): nothing to count, but it can be read</text>
  <rect x="540" y="460" width="920" height="170" rx="0" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
  <rect x="540" y="460" width="920" height="48" rx="0" fill="#eee" stroke="#ccc" stroke-width="1.2"/>
