  <text x="464" y="1140" font-size="11.5" font-weight="600" fill="#333" text-anchor="start">Nur lesen · Redaktion und Admins ändern sie</text>
  <text x="820" y="1140" font-size="11.5" font-weight="400" fill="#666" text-anchor="start">Never published: shows the draft; no Results tab yet (as today).</text>
  <text x="40" y="1210" font-size="12" font-weight="400" fill="#333" text-anchor="start">1 A pill says the view is read only and who can change the survey. No Publish, no Save state, no “Draft · Saved 2 s ago”. Ctrl K offers only going to a page or question.</text>
  <text x="40" y="1232" font-size="12" font-weight="400" fill="#333" text-anchor="start">2 Preview (side panel or new tab, as W9) and Download PDF stay: both store nothing. Results is one click, as for editors.</text>
  <text x="40" y="1254" font-size="12" font-weight="400" fill="#333" text-anchor="start">3 The outline moves around the survey as in the editor; Survey settings shows the welcome and thank-you texts and the look, as text.</text>
  <text x="40" y="1276" font-size="12" font-weight="400" fill="#333" text-anchor="start">4 The canvas is the survey as respondents see it; a click selects a question (outline) without any edit affordance: no toolbar, no inline text editing, no + buttons.</text>
  <text x="40" y="1298" font-size="12" font-weight="400" fill="#333" text-anchor="start">5 The inspector shows the same settings as the editor's, as label and value. Logic and translation status read as sentences.</text>
  <text x="40" y="1320" font-size="12" font-weight="400" fill="#333" text-anchor="start">6 Owners, admins and editors keep the editor. The server already refuses changes from analysts and viewers; this item makes the screen say so instead of failing on save.</text>
  <text x="40" y="1342" font-size="12" font-weight="400" fill="#333" text-anchor="start">7 With unpublished changes, the view shows the published version (what respondents answer) and offers the draft in one switch.</text>
  <text x="40" y="1364" font-size="12" font-weight="400" fill="#333" text-anchor="start">Email and PDF: unchanged; the PDF is the same document editors download.</text>
  <text x="40" y="1386" font-size="12" font-weight="600" fill="#333" text-anchor="start">Open for Dražan: (a) show the published version first, draft one switch away (recommended), or always the draft; (b) analysts and viewers may open Preview (recommended).</text>
</svg>
