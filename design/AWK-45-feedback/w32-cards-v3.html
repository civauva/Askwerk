<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2"); }

  @font-face { font-family: "IBM Plex Serif"; font-weight: 600; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-serif/files/ibm-plex-serif-latin-600-normal.woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1440px; background: var(--aw-paper); color: var(--aw-ink); font: 400 14px/1.45 var(--aw-font); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 232px; background: var(--aw-surface); border-right: 1px solid var(--aw-line); padding: 18px 12px; }
  .logo { font: 700 21px/1 var(--aw-font-display); margin: 2px 8px 16px; } .logo span { color: var(--aw-signal); }
  .org { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border: 1px solid var(--aw-line-strong); border-radius: 8px; font-weight: 600; font-size: 13.5px; }
  .org i { width: 24px; height: 24px; border-radius: 6px; background: var(--aw-ink); color: #fff; display: grid; place-items: center; font: 600 9.5px/1 var(--aw-font-mono); font-style: normal; }
  .nav { display: block; padding: 8px 10px; margin-top: 14px; border-radius: 6px; font-weight: 600; background: color-mix(in srgb, var(--aw-ink) 6%, var(--aw-surface)); }
  .nav2 { display: block; padding: 8px 10px; color: var(--aw-graphite); }
  .main { margin-left: 232px; padding: 28px 32px 40px; max-width: 1200px; }
  h1 { margin: 0; font: 700 32px/1.1 var(--aw-font-display); }
  .of { margin: 4px 0 0; color: var(--aw-graphite); font-size: 13.5px; }
  .bar { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
  .search { width: 300px; height: 40px; border: 1px solid var(--aw-line-strong); border-radius: 6px; background: var(--aw-surface); padding: 0 12px; display: flex; align-items: center; color: var(--aw-muted); }
  .chipf { padding: 6px 14px; border: 1px solid var(--aw-line-strong); border-radius: 16px; background: var(--aw-surface); font-weight: 600; font-size: 13px; } .chipf.on { background: var(--aw-ink); color: var(--aw-paper); border-color: var(--aw-ink); }
  .seg { margin-left: auto; display: inline-flex; border: 1px solid var(--aw-line-strong); border-radius: 6px; overflow: hidden; } .seg span { padding: 8px 12px; font-weight: 600; font-size: 13px; background: var(--aw-surface); } .seg .on { background: var(--aw-ink); color: var(--aw-paper); }
  .grow { flex: 1; }
  .chip { display: inline-flex; padding: 2px 8px; border: 1px solid var(--aw-line-strong); border-radius: 999px; font-size: 11.5px; white-space: nowrap; } .chip.draft { border-style: dashed; }
  .mono { font: 500 10.5px/1 var(--aw-font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--aw-muted); }
  .note { position: absolute; z-index: 9; max-width: 300px; padding: 8px 11px; background: #fff7cc; border: 1px solid #e3cf6a; border-radius: 6px; font-size: 12.5px; line-height: 1.4; color: #4a3d00; box-shadow: 0 4px 12px rgba(0,0,0,.08); }

  .card { background: var(--aw-surface); border: 1px solid var(--aw-line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .what { padding: 12px 14px 0; display: grid; gap: 8px; }
  .what h3 { margin: 0; font: 600 16px/1.25 var(--aw-font); }
  .what .lead { margin: -4px 0 0; font-size: 12.5px; color: var(--aw-graphite); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .size { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--aw-graphite); }
  .size b { color: var(--aw-ink); font-weight: 600; }
  .qs { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; }
  .qs li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: baseline; }
  .qs li span:first-child { font: 500 10.5px/1 var(--aw-font-mono); color: var(--aw-muted); }
  .qs li span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qs li .t { font: 500 10px/1 var(--aw-font-mono); color: var(--aw-muted); text-transform: uppercase; letter-spacing: .05em; }
  .qs li.more { display: block; color: var(--aw-muted); font-size: 12px; padding-left: 28px; }
  .answers { margin-top: auto; padding: 10px 14px; border-top: 1px solid var(--aw-line); display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: end; }
  .answers .n { font: 700 22px/1 var(--aw-font-display); }
  .answers .n small { font: 400 12px/1 var(--aw-font); color: var(--aw-graphite); margin-left: 4px; }
  .answers .sub { grid-column: 1; font-size: 11.5px; color: var(--aw-graphite); }
  .spark { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: end; gap: 2px; height: 30px; justify-self: end; }
  .spark i { width: 6px; background: color-mix(in srgb, var(--aw-ink) 22%, transparent); border-radius: 1px; } .spark i:last-child { background: var(--aw-signal); }
  .foot span { white-space: nowrap; }
  .foot { display: flex; align-items: center; gap: 8px; padding: 8px 14px 12px; font-size: 11.5px; color: var(--aw-graphite); }
  .none { font-size: 12px; color: var(--aw-muted); grid-column: 1 / -1; }

  /* the look as a strip: the page colours, pattern or picture, the accent, the start button */
  .strip { position: relative; height: 54px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--aw-line); overflow: hidden; }
  .strip .o { font: 600 9px/1 var(--aw-font); position: relative; } .strip .go { margin-left: auto; position: relative; padding: 5px 12px; font: 600 10px/1 var(--aw-font); border-radius: 999px; }
  .strip .lk { position: relative; font: 500 10px/1 var(--aw-font-mono); opacity: .8; }

  /* variant B: the front page beside the contents */
  .wide { display: grid; grid-template-columns: 220px 1fr; }
  .front { position: relative; border-right: 1px solid var(--aw-line); padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .front .o { position: relative; font: 600 8.5px/1 var(--aw-font); }
  .front .c { position: relative; display: grid; align-content: start; gap: 6px; padding: 12px; border-radius: 10px; }
  .front .c b { font-size: 14px; line-height: 1.2; } .front .c p { margin: 0; font-size: 9.5px; opacity: .8; }
  .front .go { justify-self: start; margin-top: auto; padding: 5px 12px; font: 600 9.5px/1 var(--aw-font); border-radius: 999px; }
  .wide .right { display: flex; flex-direction: column; min-width: 0; }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  body:not(.a) #a, body:not(.b) #b, body:not(.c) #c, body:not(.d) #d, body:not(.e) #e { display: none; }
  .ids { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--aw-graphite); }
  .code { font: 500 11px/1 var(--aw-font-mono); padding: 3px 6px; border-radius: 4px; background: color-mix(in srgb, var(--aw-ink) 6%, var(--aw-surface)); color: var(--aw-ink); }
  /* C: one row per survey */
  .rows { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 8px minmax(0, 1.25fr) minmax(0, 1.3fr) 190px 150px; gap: 18px; align-items: start; padding: 14px 16px 14px 0; background: var(--aw-surface); border: 1px solid var(--aw-line); border-radius: 10px; overflow: hidden; }
  .row .edge { align-self: stretch; margin: -14px 0; }
  .row h3 { margin: 0 0 4px; font: 600 15.5px/1.25 var(--aw-font); }
  .row .lead { margin: 0 0 8px; font-size: 12.5px; color: var(--aw-graphite); }
  .row .kpi { display: grid; gap: 4px; }
  .row .meta { display: grid; gap: 6px; justify-items: end; text-align: right; font-size: 11.5px; color: var(--aw-graphite); }
  /* D: the first question as respondents see it */
  .ask { margin: 0 14px; padding: 12px; border-radius: 8px; display: grid; gap: 8px; }
  .ask .qq { font-size: 13px; font-weight: 600; }
  .ask .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .ask .opts span { padding: 4px 9px; font-size: 11px; border: 1px solid #0002; border-radius: 999px; background: #fff; color: #1a1917; }
  .ask .scale { display: grid; grid-auto-flow: column; gap: 3px; }
  .ask .scale span { padding: 4px 0; text-align: center; font: 500 10.5px/1 var(--aw-font-mono); border: 1px solid #0002; border-radius: 4px; background: #fff; color: #1a1917; }
  .ask .step { font: 500 10px/1 var(--aw-font-mono); opacity: .7; }
  /* E: the key result first */
  .result { margin: 0 14px; padding: 12px; border: 1px solid var(--aw-line); border-radius: 8px; display: grid; gap: 6px; }
  .result .big { font: 700 30px/1 var(--aw-font-display); }
  .result .big small { font: 400 12px/1 var(--aw-font); color: var(--aw-graphite); margin-left: 6px; }
  .dist { display: flex; height: 10px; border-radius: 3px; overflow: hidden; }
  .legend { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--aw-graphite); }
  .result .q { font-size: 12px; color: var(--aw-graphite); }
</style></head>
<body>
<div class="side"><div class="logo">Ask<span>werk</span></div><div class="org"><i>AG</i>Acme GmbH</div><span class="nav">Surveys</span><span class="nav2">Templates</span></div>
<div class="main">

  <div class="bar"><span class="search">Search surveys</span><span class="chipf on">All 17</span><span class="chipf">Drafts 4</span><span class="chipf">Published 13</span><span class="chipf">Closed 0</span><span class="seg"><span>☰ List</span><span class="on">▦ Cards</span></span></div>

  <div id="d" class="grid3"></div>
  <div id="e" class="grid3"></div>
</div>
<div class="note" id="na"></div>
<script>
const v = new URLSearchParams(location.search).get("v") || "a";
document.body.className = v;
const S = [
  { t: "How well does our online banking work?", pub: "Published 2 Oct", code: "b4nk7qwe", n: "Demo: Digital banking", lead: "Five minutes about the app, the web and advice. We never ask for login details.", q: 14, p: 4, m: 5,
    types: "4 ratings · 5 choices · 1 NPS · 2 texts · 2 matrix", qs: [["How often do you use the app?", "choice"], ["How easy is signing in?", "rating"], ["Would you recommend us?", "NPS"]],
    r: 210, done: 86, last: "2 hours ago", spark: [3,5,4,7,9,6,8,12,10,7,9,14,11,13], st: "Published · v1", lang: "DE EN", by: "Anna Berger · changed today",
    bg: "#efeeea", ac: "#111", on: "#fff", tc: "#111", f: "'IBM Plex Mono'", look: "Monochrome", fq: { q: "How often do you use the app?", o: ["Daily", "Weekly", "Monthly", "Rarely"] }, kr: { label: "Would you recommend us?", value: "+34", unit: "NPS", dist: [18, 30, 52] } },
  { t: "Where is your next journey?", pub: "Published 1 Oct", code: "tr1p27zx", n: "Demo: Dream holiday", lead: "Ten questions, each on its own screen. We use them to plan the 2027 trips.", q: 10, p: 10, m: 4,
    types: "picture choices · ranking · slider · dates", qs: [["Which landscape calls you?", "pictures"], ["How long would you travel?", "slider"], ["Rank what matters most", "ranking"]],
    r: 150, done: 71, last: "yesterday", spark: [2,1,4,3,6,2,5,7,4,3,8,6,5,4], st: "Published · v1", lang: "DE EN", by: "Anna Berger · 12 Oct",
    bg: "linear-gradient(#2d4a6b,#d98b73 60%,#3f6478)", ac: "#c2551f", on: "#fff", tc: "#fff", f: "'IBM Plex Serif'", look: "Panorama", fq: { q: "Which landscape calls you?", o: ["Mountains", "Sea", "Cities", "Desert"] }, kr: { label: "Most chosen landscape", value: "Mountains", unit: "41 %", dist: [41, 33, 18, 8] } },
  { t: "Your experience at our outpatient clinic", pub: "Published 29 Sep", code: "k7m2pqzr", n: "Demo: Patient experience", lead: "Your answers are anonymous and help us improve care. About six minutes.", q: 18, p: 5, m: 6,
    types: "3 matrix · 6 ratings · 5 choices · 4 texts", qs: [["Which department did you visit?", "choice"], ["How long did you wait?", "choice"], ["How were you treated?", "matrix"]],
    r: 240, done: 92, last: "35 minutes ago", spark: [8,9,7,10,12,11,9,13,15,12,14,16,13,17], st: "Published · v1", lang: "DE EN", by: "Anna Berger · 9 Oct",
    bg: "#f4f7fa", ac: "#1f5f8b", on: "#fff", tc: "#1a1917", f: "'IBM Plex Sans'", look: "Klinik", fq: { q: "Which department did you visit?", o: ["Cardiology", "Orthopaedics", "Dermatology", "Other"] }, kr: { label: "How were you treated?", value: "4.4", unit: "of 5", dist: [3, 5, 9, 31, 52] } },
  { t: "Employee pulse Q4", pub: null, code: "p9lse4qq", n: "Employee pulse Q4", lead: "Five questions, anonymous. Your answers help us make work better.", q: 5, p: 1, m: 2,
    types: "3 ratings · 1 choice · 1 text", qs: [["How do you feel at work this week?", "rating"], ["Do you have what you need?", "yes/no"], ["What should we change first?", "text"]],
    r: 0, done: 0, last: null, spark: [], st: "Draft", lang: "DE", by: "Changed yesterday",
    bg: "#fff", ac: "#d2440f", on: "#fff", tc: "#1a1917", f: "'IBM Plex Sans Condensed'", look: "Werkstatt", fq: { q: "How do you feel at work this week?", scale: 5 }, kr: null },
  { t: "Your visit to the City Museum", pub: "Published 3 Oct", code: "mu5eum3a", n: "Demo: City museum visit", lead: "Tell us in five minutes what you saw and what we could do better.", q: 12, p: 3, m: 5,
    types: "pictures · 4 ratings · 3 choices · 2 texts", qs: [["Which exhibition did you see?", "pictures"], ["How was the audio guide?", "rating"], ["What did you miss?", "text"]],
    r: 180, done: 78, last: "3 hours ago", spark: [4,6,5,8,10,14,12,6,5,7,9,13,15,11], st: "Published · v1", lang: "DE EN", by: "Anna Berger · 8 Oct",
    bg: "linear-gradient(#e9dcc7 0 40%, #fbf7f0 40%)", ac: "#2f6f4f", on: "#fff", tc: "#1a1917", f: "'IBM Plex Serif'", look: "Atelier", fq: { q: "Which exhibition did you see?", o: ["Old masters", "Modern", "Photography"] }, kr: { label: "How was the audio guide?", value: "3.9", unit: "of 5", dist: [6, 10, 16, 38, 30] } },
  { t: "Supplier assessment 2026", pub: "Published 15 Sep", code: "sup26aqx", n: "Demo: Supplier assessment", lead: "For purchasing and quality. Please fill in once per supplier; the form also prints.", q: 22, p: 6, m: 9,
    types: "5 matrix · 9 ratings · 4 choices · 4 texts", qs: [["Which supplier are you assessing?", "choice"], ["Delivery on time", "matrix"], ["Quality of the goods", "matrix"]],
    r: 36, done: 100, last: "6 Oct", spark: [0,0,1,3,2,0,0,4,6,5,0,0,2,1], st: "Closed 6 Oct", lang: "DE EN", by: "Anna Berger · 6 Oct",
    bg: "#fff", ac: "#111", on: "#fff", tc: "#111", f: "'IBM Plex Serif'", look: "Papier", fq: { q: "Which supplier are you assessing?", o: ["Müller AG", "Nordstahl", "Kranz & Co", "…"] }, kr: { label: "Delivery on time", value: "78 %", unit: "on time or early", dist: [7, 15, 78] } },
];
const spark = (s) => s.length ? `<span class="spark">${s.map((h) => `<i style="height:${Math.max(2, h * 2)}px"></i>`).join("")}</span>` : "";
const answers = (s) => s.r === 0
  ? `<div class="answers"><span class="none">No answers yet · publish to collect</span></div>`
  : `<div class="answers"><span class="n">${s.r}<small>responses</small></span>${spark(s.spark)}<span class="sub">${s.done} % complete · last ${s.last}</span></div>`;
const what = (s, nq) => `<div class="what"><h3>${s.t}</h3><p class="lead">${s.lead}</p>
  <div class="size"><span><b>${s.q}</b> questions</span><span><b>${s.p}</b> ${s.p === 1 ? "page" : "pages"}</span><span>about <b>${s.m} min</b></span></div>
  <ol class="qs">${s.qs.slice(0, nq).map(([q, ty], i) => `<li><span>${String(i + 1).padStart(2, "0")}</span><span>${q}</span><span class="t">${ty}</span></li>`).join("")}<li class="more">+ ${s.q - nq} more · ${s.types}</li></ol></div>`;
const foot = (s) => `<div class="foot"><span class="chip ${s.st === "Draft" ? "draft" : ""}">${s.st}</span><span>${s.pub ?? s.by}</span><span class="grow"></span><span class="code">/s/${s.code}</span><span>${s.lang}</span></div>`;
const kpi = (s) => s.r === 0 ? `<span class="none">No answers yet</span>` : `<span class="n" style="font:700 22px/1 var(--aw-font-display)">${s.r}<small style="font:400 12px var(--aw-font);color:var(--aw-graphite);margin-left:4px">responses</small></span><span style="font-size:11.5px;color:var(--aw-graphite)">${s.done} % complete · last ${s.last}</span>${spark(s.spark)}`;
const shades = (n) => ["#c94a3a", "#e39b58", "#d9d2c3", "#7fb08f", "#2f6f4f"].slice(5 - n);
const firstQ = (s) => `<div class="ask" style="background:${s.bg};color:${s.tc}"><span class="step">QUESTION 1 OF ${s.q}</span><span class="qq" style="font-family:${s.f}">${s.fq.q}</span>${s.fq.scale
  ? `<span class="scale">${Array.from({ length: s.fq.scale }, (_, i) => `<span>${i + 1}</span>`).join("")}</span>`
  : `<span class="opts">${s.fq.o.map((o) => `<span>${o}</span>`).join("")}</span>`}</div>`;
const result = (s) => s.kr === null
  ? `<div class="result"><span class="q">Not published yet. Once answers come in, the main result shows here.</span></div>`
  : `<div class="result"><span class="q">${s.kr.label}</span><span class="big">${s.kr.value}<small>${s.kr.unit}</small></span>
     <span class="dist">${s.kr.dist.map((d, i, all) => `<i style="width:${d}%;background:${(all.length === 3 ? ["#c94a3a", "#d9d2c3", "#2f6f4f"] : all.length === 4 ? ["#2f6f4f", "#7fb08f", "#d9d2c3", "#e39b58"] : shades(5))[i]}"></i>`).join("")}</span>
     <span class="legend"><span>${s.r} responses · ${s.done} % complete</span><span>last ${s.last}</span></span></div>`;
document.getElementById("a").innerHTML = S.map((s) => `<div class="card">
  <div class="strip" style="background:${s.bg};color:${s.tc}"><span class="o">● Acme GmbH</span><span class="lk">${s.look}</span><span class="go" style="background:${s.ac};color:${s.on}">Start</span></div>
  ${what(s, 3)}${answers(s)}${foot(s)}</div>`).join("");
document.getElementById("b").innerHTML = S.slice(0, 4).map((s) => `<div class="card wide">
  <div class="front" style="background:${s.bg};color:${s.tc}"><span class="o">● Acme GmbH</span>
    <div class="c" style="background:${s.bg.startsWith("linear") ? "rgba(255,255,255,.88)" : "#fff"};color:#1a1917;border:1px solid #0001"><b style="font-family:${s.f}">${s.t}</b><p>${s.lead}</p><span class="go" style="background:${s.ac};color:${s.on}">Start</span></div></div>
  <div class="right">${what(s, 3)}${answers(s)}${foot(s)}</div></div>`).join("");
const head = (s) => `<div class="what"><h3>${s.t}</h3><p class="lead">${s.lead}</p>
  <div class="size"><span><b>${s.q}</b> questions</span><span><b>${s.p}</b> ${s.p === 1 ? "page" : "pages"}</span><span>about <b>${s.m} min</b></span></div></div>`;
const strip = (s) => `<div class="strip" style="background:${s.bg};color:${s.tc}"><span class="o">● Acme GmbH</span><span class="lk">${s.look}</span><span class="go" style="background:${s.ac};color:${s.on}">Start</span></div>`;
document.getElementById("c").innerHTML = S.map((s) => `<div class="row">
  <span class="edge" style="background:${s.bg.startsWith("linear") ? s.bg : s.ac}"></span>
  <div><h3>${s.t}</h3><p class="lead">${s.lead}</p><div class="size"><span><b>${s.q}</b> questions</span><span><b>${s.p}</b> ${s.p === 1 ? "page" : "pages"}</span><span>about <b>${s.m} min</b></span><span>${s.look}</span></div></div>
  <ol class="qs">${s.qs.map(([q, ty], i) => `<li><span>${String(i + 1).padStart(2, "0")}</span><span>${q}</span><span class="t">${ty}</span></li>`).join("")}<li class="more">+ ${s.q - 3} more · ${s.types}</li></ol>
  <div class="kpi">${kpi(s)}</div>
  <div class="meta"><span class="chip ${s.st === "Draft" ? "draft" : ""}">${s.st}</span><span>${s.pub ?? "Not published"}</span><span class="code">/s/${s.code}</span><span>${s.lang}</span></div></div>`).join("");
document.getElementById("d").innerHTML = S.map((s) => `<div class="card">${head(s)}<div style="height:10px"></div>${firstQ(s)}<div style="height:10px"></div>${answers(s)}${foot(s)}</div>`).join("");
document.getElementById("e").innerHTML = S.map((s) => `<div class="card">${strip(s)}${head(s)}<div style="height:10px"></div>${result(s)}<div style="height:10px"></div>${foot(s)}</div>`).join("");
const na = document.getElementById("na");
if (v === "a") { na.style.cssText = "right:24px;top:18px"; na.innerHTML = "<b>A · summary card</b>, now with the published date and the link code (/s/…) in the footer; drafts show who changed them last."; }
else if (v === "b") { na.style.cssText = "right:24px;top:18px"; na.innerHTML = "<b>B · wide card:</b> the front page beside the contents, two per row. More of the look, the same facts."; }
else if (v === "c") { na.style.cssText = "right:24px;top:18px"; na.innerHTML = "<b>C · one row per survey:</b> what it is, what it asks, how answering goes and its facts side by side. Scans like a list, says as much as a card; the look is the coloured edge."; }
else if (v === "d") { na.style.cssText = "right:24px;top:18px"; na.innerHTML = "<b>D · the first question:</b> instead of a list of questions, the first one as respondents see it, in the survey's look. Shows what it asks and how it looks at once."; }
else { na.style.cssText = "right:24px;top:18px"; na.innerHTML = "<b>E · the key result first:</b> for published surveys the main answer (NPS, average, top choice) with its spread; drafts say what will show. Purpose and size above."; }
</script>
</body></html>
