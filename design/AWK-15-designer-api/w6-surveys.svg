  <text x="766" y="868" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">FK survey_id, number</text>
  <text x="766" y="894" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">definition jsonb (source of truth)</text>
  <text x="766" y="920" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">state (draft | published)</text>
  <text x="766" y="946" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">published_at, FK created_by → User</text>
  <text x="766" y="972" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">one draft per survey (unique index)</text>
  <text x="766" y="998" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">published: immutable (trigger)</text>
  <rect x="1100" y="790" width="340" height="230" rx="6" fill="#fff" stroke="#555" stroke-width="1.2"/>
  <text x="1116" y="816" font-size="14" font-weight="700" fill="#111" text-anchor="start">Page / Question / Option, VariableMapping</text>
  <text x="1116" y="842" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">written at publish, from the definition</text>
  <text x="1116" y="868" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">Question: variable_name unique per survey</text>
  <text x="1116" y="894" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">Option: code, label (translation map)</text>
  <text x="1116" y="920" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">VariableMapping: from → to, since version</text>
  <text x="1116" y="946" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">  (renames found by the publish checks)</text>
  <text x="1116" y="972" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">nothing derived from drafts</text>
  <circle cx="390" cy="808" r="10" fill="#444"/>
  <text x="390" y="812" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="400" y="1124" font-size="13" font-weight="700" fill="#111" text-anchor="start">Endpoints (App API, cookie session):</text>
  <text x="400" y="1150" font-size="12" font-weight="400" fill="#333" text-anchor="start">GET  /api/app/surveys?status=&amp;search=           list for the current organisation (every role)</text>
  <text x="400" y="1172" font-size="12" font-weight="400" fill="#333" text-anchor="start">POST /api/app/surveys  {title, languages, defaultLanguage}   editor and up → the new survey with an empty first page</text>
  <text x="400" y="1194" font-size="12" font-weight="400" fill="#333" text-anchor="start">GET  /api/app/surveys/{id}/draft                 draft, version number, last published definition</text>
  <text x="400" y="1216" font-size="12" font-weight="400" fill="#333" text-anchor="start">PUT  /api/app/surveys/{id}/draft  {definition}   autosave; checked against the schema, not the publish checks</text>
  <text x="400" y="1238" font-size="12" font-weight="400" fill="#333" text-anchor="start">POST /api/app/surveys/{id}/publish               publish checks on the server too (same corpus as the designer); 409 with findings</text>
  <text x="40" y="1340" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">0  Surveys belong to one organisation (tenant_id, enforced by row-level security). The list, search and “New survey” always work in the organisation chosen in the top bar; switching it shows that organisation's surveys.</text>
  <text x="40" y="1362" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">1  “New survey” for editors, admins and owners; analysts and viewers see the list only (opening the designer read-only comes later).</text>
  <text x="40" y="1384" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">2  Filters by status and a search on the title.  3  One row per survey; status shows the latest version and whether the draft has changes since.</text>
  <text x="40" y="1406" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">4  Title is internal (the respondents see the page texts). Languages and the default can be changed later in the designer.  5  Empty state per role.</text>
  <text x="40" y="1428" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">6  Audit: survey created and survey published on the organisation's chain; draft autosaves are not audited (too many), the published version is.</text>
</svg>
