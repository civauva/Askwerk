  <text x="416" y="946" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">languages[], default_language</text>
  <text x="416" y="972" font-size="12.5" font-weight="400" fill="#111" text-anchor="start">anonymity_mode, settings jsonb</text>
  <text x="416" y="998" font-size="12.5" font-weight="400" fill="#888" text-anchor="start">FK workspace_id  — empty until workspaces</text>
