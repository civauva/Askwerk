<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<!-- W41: the logo tile in the sidebar. Three options side by side, the sidebar's top and the start of the page bar. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>W41 Sidebar logo</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 400; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans-condensed/files/ibm-plex-sans-condensed-latin-400-normal.woff2"); }
  @font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 700; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-sans-condensed/files/ibm-plex-sans-condensed-latin-700-normal.woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../src/frontend/packages/ui/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2"); }
  :root { --ink: #1a1917; --graphite: #4d4a45; --muted: #8a877f; --line: #e5e2db; --line-strong: #cfcac0; --paper: #f5f3ef; --signal: #d1440f; --soft: #efede8;
          --font: "IBM Plex Sans", system-ui, sans-serif; --display: "IBM Plex Sans Condensed", var(--font); --mono: "IBM Plex Mono", monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #dedad2; color: var(--ink); font: 400 14px/1.45 var(--font); display: flex; gap: 24px; }
  .opt { width: 520px; }
  .opt h2 { margin: 0 0 4px; font: 700 18px/1.2 var(--display); }
  .opt p { margin: 0 0 12px; font-size: 13px; color: var(--graphite); min-height: 38px; }
  .frame { position: relative; height: 330px; background: var(--paper); border: 1px solid var(--line-strong); overflow: hidden; }
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: 232px; background: #fff; border-right: 1px solid var(--line); }
  .head { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .word { font: 700 19px/1 var(--display); letter-spacing: -0.01em; } .word b, .word span { color: var(--signal); font-weight: 700; }
  .org { margin: 12px; display: flex; gap: 9px; align-items: center; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; font-weight: 600; font-size: 13.5px; }
  .org i { width: 24px; height: 24px; border-radius: 6px; background: var(--ink); color: #fff; display: grid; place-items: center; font: 600 9.5px var(--mono); font-style: normal; }
  .nav { padding: 7px 22px; color: var(--graphite); } .nav.on { margin: 0 12px; padding: 7px 10px; background: var(--soft); border-radius: 6px; color: var(--ink); font-weight: 600; }
  .bar { position: absolute; left: 232px; right: 0; top: 0; height: 56px; display: flex; align-items: center; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); font: 400 20px/1.2 var(--display); color: var(--graphite); white-space: nowrap; }
  .bar b { color: var(--ink); } .bar .sep { color: var(--muted); margin: 0 6px; }
  .tile { flex: none; display: block; }
</style>
</head>
<body>
<script>
const tile = (size) => `<svg class="tile" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="3" fill="#d1440f"/><path d="M10 11V8h12v8h-6v4" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="square"/><rect x="14.2" y="22.6" width="3.6" height="3.6" fill="#fff"/></svg>`;
const options = [
  ["A · Today", "Text only, capital A. Not the brand logo: the spec asks for the tile and the lowercase wordmark.", `<span class="word">Ask<span>werk</span></span>`],
  ["B · The logo as on sign-in", "The 20 px tile and \"ask<b>werk</b>\", exactly the Logo component used on the sign-in pages and the setup wizard.", `${tile(20)}<span class="word">ask<b>werk</b></span>`],
  ["C · Larger tile", "A 24 px tile, the same size as the organisation's badge below it, and a slightly larger wordmark.", `${tile(24)}<span class="word" style="font-size:20px">ask<b>werk</b></span>`],
];
document.body.innerHTML = options.map(([title, note, head]) => `<div class="opt"><h2>${title}</h2><p>${note}</p><div class="frame">
  <div class="side"><div class="head">${head}</div><div class="org"><i>AG</i>Acme GmbH ▾</div><div class="nav">Surveys</div><div class="nav">Templates</div><div class="nav on">Contacts</div><div class="nav">Connections</div></div>
  <div class="bar">Administration<span class="sep">›</span><b>Contacts</b></div></div></div>`).join("");
</script>
</body>
</html>
