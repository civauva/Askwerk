  <text x="40" y="1520" font-size="12" font-weight="400" fill="#333" text-anchor="start">1 One bar on every survey screen: Surveys › name ▾ (back, and the survey's menu), the status, search (Ctrl K), language, Preview ▾, and one primary action: Publish, Publish changes, or Share once published.</text>
  <text x="40" y="1542" font-size="12" font-weight="400" fill="#333" text-anchor="start">2 Tabs for the survey's parts, always in this order: Build · Settings · Share · Results · Participants, with counts. Settings (W9) and Share (links, QR, embed, invite; W12) become tabs instead of an outline entry and a dialog.</text>
  <text x="40" y="1564" font-size="12" font-weight="400" fill="#333" text-anchor="start">3 Pages in the outline: drag ⋮⋮ to reorder; ⋯ on a page: Rename, Move up, Move down, Duplicate, Delete page (asks; says how many questions go with it).</text>
  <text x="40" y="1586" font-size="12" font-weight="400" fill="#333" text-anchor="start">4 Click a page's header on the canvas to select the page; its title is edited in place, per language, like question texts.</text>
  <text x="40" y="1608" font-size="12" font-weight="400" fill="#333" text-anchor="start">5 The inspector shows the page: its title and translations (edited on the canvas, as W9), how many questions, move, delete. Showing a page only under a condition comes with the logic editor.</text>
  <text x="40" y="1630" font-size="12" font-weight="400" fill="#333" text-anchor="start">6 Each tab keeps its tools inside its own row: Results has its filters, views and Export there; Download PDF moves into Preview ▾ and the survey's menu.</text>
  <text x="40" y="1652" font-size="12" font-weight="400" fill="#333" text-anchor="start">7 Analysts and viewers (W15 rev. 2) get the same bar and only the Results and Participants tabs; no primary action.</text>
  <text x="40" y="1674" font-size="12" font-weight="400" fill="#333" text-anchor="start">8 The survey's menu holds what is rare: rename, duplicate, save as template, PDF, close, archive.</text>
  <text x="40" y="1696" font-size="12" font-weight="400" fill="#333" text-anchor="start">Email and PDF: unchanged.</text>
  <text x="40" y="1718" font-size="12" font-weight="600" fill="#333" text-anchor="start">Open for Dražan: (a) Settings and Share as tabs (recommended) or left where they are; (b) Participants as its own tab (recommended) or inside Results; (c) Share as the primary action once published (recommended).</text>
</svg>
